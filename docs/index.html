here, so both count the same way.<\/p>"},{"title":"shape (ma_usage.to_json)","from":"plugins/my-agent/l4-tools-guards/lib/ma_usage.py","html":"<pre class=\"code\" data-lang=\"json\"><code>{\n &quot;written&quot;: &quot;2026-01-01 00:00:00&quot;,\n &quot;sessions&quot;: [\n  &quot;&lt;session-id&gt;&quot;\n ],\n &quot;windows&quot;: [\n  {\n   &quot;rev&quot;: 0,\n   &quot;step&quot;: 1,\n   &quot;model&quot;: &quot;claude-opus-5-5&quot;,\n   &quot;usage&quot;: {\n    &quot;input_tokens&quot;: 0,\n    &quot;output_tokens&quot;: 0,\n    &quot;cache_creation_input_tokens&quot;: 0,\n    &quot;cache_read_input_tokens&quot;: 0\n   }\n  }\n ]\n}<\/code><\/pre>"}]},{"id":"archive/","steps":["G1b","5","R"],"writer":"L1","comment":"copies: right before a revision &lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;/, rewrite before approval -rev&lt;N&gt;-draft/, verdicts before going back -run&lt;n&gt;/ (4.8.1)","sources":[{"title":"4.8.1 Change requests during a task","from":"plugins/my-agent/docs/build-guide/my-agent-architecture.md","html":"<p>The procedure for when the person changes the request before the task ends (before G3 acceptance). It is based on the my-dev Revisions procedure and adds what only my-agent has: parallel runs, worktrees, workflows and <code>.active<\/code> (P16).<\/p><ul><li><strong>The record of truth (v0.27, review B4):<\/strong> the single source of the revision history is the run-log <code>revision:<\/code> lines. <code>## Revisions<\/code> at the end of <code>plan.md<\/code> is a secondary record for people to read. It survives when the architect rewrites <code>plan.md<\/code> (4.4), and even if it does not, the history is in the run-log.<\/li><li><strong>Front of SKILL.md (review B6):<\/strong> this procedure sits in the back part of SKILL.md, outside the first 5,000 tokens that are re-attached after compaction. So the core rules hold a one-line \"change requests\" rule (do not fix right away, follow this procedure; before approval, archive and write a <code>revision<\/code> line).<\/li><\/ul><p><strong>1. Classify the request (L1, popup)<\/strong><\/p><p>When L1 gets a message that looks like a change, it first confirms the kind in a popup. If the user answered with a question, L1 answers it and then asks the same decision again in a popup (P3).<\/p><div class=\"tbl\"><table><thead><tr><th>Choice<\/th><th>Meaning<\/th><th>Next<\/th><\/tr><\/thead><tbody><tr><td>Revise this task<\/td><td>The completion criteria, non-goals, constraints or exception cases change, or the method, work units or files of the approved plan change<\/td><td>Items 2–8 below<\/td><\/tr><tr><td>Adjust within approved scope<\/td><td>Keeping the approved request needs one more file, behavior or dependency<\/td><td>Record it as a <code>Scope change:<\/code> line under <code>## Approval<\/code> in <code>plan.md<\/code> (edit only that section with Edit), write a <code>fix: what=&quot;Scope change: &lt;what&gt;&quot; files=plan.md<\/code> line to the run-log, then go on (v0.27, review B3). The tally counts this line apart from L1 small fixes, as <code>adjustments within approved scope<\/code>, and the monitor shows it in the record list. Verify and Review also judge against this line.<\/td><\/tr><tr><td>Split into a new task<\/td><td>A request independent of the current task<\/td><td>Finish or abort the current task, then start with a new task ID (4.7.3).<\/td><\/tr><tr><td>Cancel<\/td><td>No change<\/td><td>Continue the current step.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>L1 picks the recommended option for the situation and puts it first with <code>(Recommended)<\/code>.<\/li><li><strong>Deferred direct checks (2026-10-26):<\/strong> if the person defers a check they must do themselves, such as a hands-on check, L1 writes a <code>Scope change: criterion &lt;n&gt; is checked by the user later<\/code> line under <code>## Approval<\/code> in <code>plan.md<\/code> on the spot (and the same run-log <code>fix:<\/code> line). Verify takes this line and judges that criterion within that scope, so the deferred check does not make Verify end in FAIL.<\/li><li><strong>Rewrite before approval (v0.27, review B1):<\/strong> every case where the architect rewrites <code>plan.md<\/code> before G1b approval (G1b <code>Request changes<\/code>, Plan Review <code>REVISE<\/code>, applying Plan Review findings, prototype popup <code>Plan change<\/code>) skips this classification popup and items 2–8. There is no approved plan yet, so rev does not go up either. Instead, before handing it back to the architect, L1 archives the task folder to <code>archive/&lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;-draft/<\/code> (N is the current rev, 0 if there was no revision) (the same way as item 4) and writes a <code>revision: rev=&lt;N&gt; before=G1b why=… archive=…<\/code> line to the run-log. Nothing is written to <code>## Revisions<\/code>. The monitor shows this line as \"plan rewrite before approval\", and the tally counts it as <code>plan rewrites before approval<\/code>. If that request changes the confirmed scope (<code>scope.md<\/code>), it follows this procedure (revise the same task).<\/li><\/ul><p><strong>2. Pause<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>What is running<\/th><th>Handling<\/th><\/tr><\/thead><tbody><tr><td>New delegation<\/td><td>Not started.<\/td><\/tr><tr><td>Background subagent<\/td><td>Wait until it ends; its result is not thrown away. Add a new <code>stale: id=&lt;agent_id&gt; rev=&lt;new rev&gt;<\/code> line to the run-log (lines already written are not changed), and set that work unit in <code>plan.md<\/code> to <code>stale<\/code>. For a long research job, ask in a popup: <code>Stop (Recommended)<\/code> / <code>Wait until done<\/code>.<\/td><\/tr><tr><td>workflow<\/td><td>It takes no input while running (F4), so stop it (TaskStop). Record the finished units and the unhandled units in the run-log.<\/td><\/tr><tr><td>coder worktree<\/td><td>Neither deleted nor merged; left as is. Item 7 decides what to do with it.<\/td><\/tr><tr><td>Code rollback<\/td><td>Not done. Only after the changed plan is approved.<\/td><\/tr><\/tbody><\/table><\/div><p><strong>3. Decide which phase to go back to<\/strong><\/p><ul><li>If the WHAT/WHY changes (purpose, completion criteria, non-goals), go to ① Define (Scope). In the general profile the scope summary is at the top of <code>plan.md<\/code>, so go to ② Plan.<\/li><li>If only the HOW changes (method, work units, files), go to ② Plan.<\/li><li>Tell the person in one line which phase and why.<\/li><\/ul><p><strong>4. Archive<\/strong><\/p><ul><li><strong>Location:<\/strong> <code>docs/agent/&lt;task-id&gt;/archive/&lt;YYMMDD-hhmmss&gt;-rev&lt;N&gt;/<\/code><ul><li>The time is set once with <code>date +%y%m%d-%H%M%S<\/code>.<\/li><li>If the same name exists, add <code>-b<\/code>, <code>-c<\/code>. Never write into an existing archive folder.<\/li><li>A rewrite before approval ends in <code>-rev&lt;N&gt;-draft<\/code>, and a verdict archive before going back to Execute ends in <code>-run&lt;n&gt;<\/code> (below). The monitor treats only folders ending in <code>-rev&lt;N&gt;<\/code> (N ≥ 1) as old approved plans and puts them in the mock-up history.<\/li><\/ul><\/li><li><strong>What is copied:<\/strong> the whole task folder with <code>cp -pR<\/code>. Paths are absolute, without <code>cd<\/code>. The G1b hook treats a relative path after <code>cd<\/code> as relative to every folder the <code>cd<\/code> could reach (4.4), so the archive for a rewrite before approval would be blocked (confirmed in v0.27). The <code>work/<\/code> and <code>prototype/<\/code> subfolders are included; <code>archive/<\/code> itself is left out.<\/li><li><strong>Check:<\/strong> compare every file with <code>cmp<\/code>. If even one is missing or different, stop and tell the person. Nothing in the original is deleted at that point.<\/li><li><strong>The archive folder is only a record.<\/strong> Gates, hooks, resume and judges (L2) do not read it, and it is never in the paths passed to judges.<\/li><\/ul><p><strong>5. Record<\/strong><\/p><ul><li>Write a <code>revision: rev=&lt;N&gt; why=… archive=… to=&lt;phase to go back to&gt; invalidated=… keep=… state=pending<\/code> line to the run-log (example in 4.7.2). <code>to=<\/code> lets <code>continue<\/code> set the <code>phase:<\/code> of <code>.active<\/code> if this revision is cut off midway. It is written before anything else changes. The run-log belongs to the same task, so it is not moved; writing continues in it.<\/li><li>Add one line to <code>## Revisions<\/code> at the end of <code>plan.md<\/code> (after <code>## Approval<\/code>). Create the section if it is missing. Even when going back to ①, write it in <code>plan.md<\/code>, not <code>scope.md<\/code> (v0.27, review B5: the monitor and hooks look only at <code>plan.md<\/code>). When the architect rewrites <code>plan.md<\/code>, it carries this section over as is (4.4).<\/li><li><strong>How to edit the sections (2026-10-26):<\/strong> find <code>## Revisions<\/code> and <code>## Approval<\/code> (item 6) by headings that start at the beginning of a line (<code>## Revisions<\/code>, <code>## Approval<\/code>), and edit only that section with the Edit tool. Do not cut the file by string position, and do not overwrite the whole file with Write. If the body quotes the same text, cutting by position duplicates or loses body text (my-dev feedback).<pre class=\"code\" data-lang=\"text\"><code>- rev&lt;N&gt; &lt;YYYY-MM-DD HH:MM&gt; &lt;what changed, the user&#x27;s request&gt;; archive &lt;path&gt;; back to &lt;phase&gt;<\/code><\/pre><\/li><\/ul><ul><li>Whether invalidation is finished is recorded not on this line but on the run-log <code>state=<\/code> line (item 6). The <code>; invalidated: pending|done<\/code> tail used through v0.26 is no longer written.<\/li><li>An archive folder that appears in no <code>archive=<\/code> of any <code>revision:<\/code> line and no <code>archive=<\/code> of any <code>step:<\/code> line is the trace of a revision cut off midway. Leave it and ignore it.<\/li><\/ul><p>**6. Invalidation and <code>.active<\/code>**<\/p><ul><li>Delete the files that judged the old version: <code>plan-review.md<\/code>, <code>verify.md<\/code>, <code>review.md<\/code>. Copies are in the archive folder.<\/li><li>Empty <code>## Approval<\/code> in <code>plan.md<\/code>. Empty the <code>Scope change:<\/code> lines with it. When going back to ①, also empty <code>## Confirmation<\/code> in <code>scope.md<\/code>.<\/li><li>Rebuild <code>prototype/<\/code> only when the mock-up changed.<\/li><li>Change the <code>phase:<\/code> of <code>.active<\/code> to the phase gone back to. The approval line is now empty, so the hook again blocks delegation and writes (4.4).<\/li><li>When done, write a <code>revision: rev=&lt;N&gt; state=done<\/code> line to the run-log. The monitor shows the two lines of the same rev as one, and <code>check-run.py<\/code> counts a rev without <code>state=done<\/code> as a failure. When <code>continue<\/code> sees a rev without <code>state=done<\/code>, it finishes the rest. The archive was finished before the <code>revision<\/code> line, so it is not compared again (the verdict files may already be deleted); <code>continue<\/code> only checks that the archive folder exists and is not empty, then goes through the <code>## Revisions<\/code> line, deleting the verdict files, emptying <code>## Approval<\/code> and (for ①) <code>## Confirmation<\/code>, the <code>phase:<\/code> of <code>.active<\/code> (<code>to=<\/code>) and the <code>state=done<\/code> line in order, skipping what is already done.<\/li><li>The Verify consecutive FAIL count is the number of <code>Verdict: FAIL<\/code>s since the last <code>Verdict: ALL PASS<\/code> or the last same-task revision. L1 and the monitor both count it from <code>result=<\/code> on the verifier's <code>stop:<\/code> lines in the run-log. <code>Run:<\/code> in <code>verify.md<\/code> is the verdict round and goes up even after a PASS, so it is not used as the consecutive count (review D5).<\/li><\/ul><p><strong>7. Continue again<\/strong><\/p><ul><li>Proceed in order from the phase gone back to, and pass every gate again. The skip rules (4.3) are also decided again against the changed request.<\/li><li>If deliverables already exist, the architect puts an <code>## Existing work<\/code> table (<code>| Target | Decision | Reason |<\/code>) in the changed plan after <code>## Estimate<\/code> and before <code>## Approval<\/code> (v0.27, position and columns aligned with the architect definition). The decisions available per target:<div class=\"tbl\"><table><thead><tr><th>Target<\/th><th>Decision<\/th><\/tr><\/thead><tbody><tr><td>Notes and drafts in <code>work/<\/code><\/td><td>keep / revise / discard. Discarded files are not deleted but moved to <code>archive/&lt;this revision&#x27;s folder&gt;/discarded/<\/code>.<\/td><\/tr><tr><td>Unmerged coder worktree<\/td><td>merge / redo / discard. Discard makes the worktree cleanup one work unit.<\/td><\/tr><tr><td>Already merged code (dev)<\/td><td>keep / revise / revert. A revert is a work unit of its own.<\/td><\/tr><\/tbody><\/table><\/div><\/li><\/ul><ul><li>Nothing is deleted or rolled back before the changed plan is approved at G1b.<\/li><\/ul><p><strong>8. Count<\/strong><\/p><ul><li>When the same task reaches its 4th revision (four-unit principle), ask in a popup before entering the revision procedure: <code>Keep revising (Recommended)<\/code> / <code>Restart as a new task<\/code> / <code>Abort<\/code><\/li><\/ul><p><strong>Before and after G3<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>When<\/th><th>Request<\/th><th>Handling<\/th><\/tr><\/thead><tbody><tr><td><code>Rework<\/code> in the G3 popup<\/td><td>The criteria stay; the result falls short<\/td><td>No revision procedure (rev); go to ③ Build through \"Back to Execute\" below. The shortfalls are passed like failed criteria.<\/td><\/tr><tr><td>A request in the G3 popup that changes the criteria<\/td><td>The criteria change<\/td><td>Follows this procedure (revise the same task).<\/td><\/tr><tr><td>After G3 acceptance<\/td><td>The deliverable is already saved, the retrospective is over and <code>.active<\/code> is deleted<\/td><td>A <strong>new task<\/strong>. Create a new task ID and write <code>Follows: &lt;previous task ID&gt;<\/code> in <code>intake.md<\/code>. The previous task folder is not touched.<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The final deliverable (research note, document, commit) is saved only after G3. So a revision before G3 leaves no deliverable outside the project to clean up.<\/li><li>The exception is code already merged into the main working tree in the dev profile. It is handled in <code>## Existing work<\/code> in item 7.<\/li><\/ul><p><strong>Back to Execute (v0.27, review B2)<\/strong><\/p><p>This is for going back to ③ Build on Verify FAIL, a Review BLOCKER (when an L1 small fix is not enough), or G3 <code>Rework<\/code>. rev does not go up. The next verdict overwrites <code>verify.md<\/code> and <code>review.md<\/code>, so the current verdict is kept first (<code>phases/accept.md<\/code>).<\/p><ol><li>Copy <code>verify.md<\/code> and (if present) <code>review.md<\/code> with <code>cp -p<\/code> to <code>archive/&lt;YYMMDD-hhmmss&gt;-run&lt;n&gt;/<\/code> (n is <code>Run:<\/code> of <code>verify.md<\/code>) and compare with <code>cmp<\/code>.<\/li><li>Set only the work units tied to the failed criteria (or the shortfalls named at G3) back to <code>Status: pending<\/code>. The last writer unit that assembles a document deliverable is also <code>pending<\/code> if any earlier unit is <code>pending<\/code>. The rest stay <code>done<\/code>.<\/li><li>Change the <code>phase:<\/code> of <code>.active<\/code> to <code>3<\/code>, and add <code>back=&quot;&lt;reason&gt;&quot; archive=&lt;archive folder&gt;<\/code> to the Execute <code>step:<\/code> line (example in 4.7.2). No new run-log kind is added. The monitor shows this line as \"back to Execute\".<\/li><li>The repeated Execute does not redo the base point (<code>base:<\/code>) or the uncommitted-changes popup, and coder runs in the main tree without a worktree. The changes already merged are not committed, so a worktree cannot see them (Q9).<\/li><\/ol><ul><li><strong>Small fix with only Review rerun (review A3):<\/strong> when L1 fixes a BLOCKER with a small fix and reruns only Review without Verify, L1 uses Edit to add an <code>## Applied after review<\/code> section at the end of the new <code>review.md<\/code> and lists each fix on one line. The verdict freshness hook lets G3 save or commit pass only if this section exists when <code>verify.md<\/code> is older than the change (4.4).<\/li><\/ul><p><strong>What the files look like after a revision<\/strong><\/p><pre class=\"code\" data-lang=\"text\"><code>&lt;work project&gt;/docs/agent/\n├── .active                          # task unchanged, only phase set to the phase gone back to\n└── 261024-cli-json-output/          # same task, so the folder stays\n    ├── scope.md                     # (if gone back to ①) ## Confirmation emptied\n    ├── plan.md                      # ## Approval emptied, ## Revisions line at the end, ## Existing work after the rewrite\n    ├── work/                        # left as is → keep/revise/discard in Existing work\n    ├── run-log.md                   # continued (revision: rev=1 … state=pending, revision: rev=1 state=done)\n    └── archive/\n        ├── 261024-140500-rev0-draft/ # before the rewrite for a G1b change request (rewrite before approval)\n        ├── 261024-150000-run1/       # verify.md before going back to Execute on Verify FAIL\n        └── 261024-153000-rev1/      # whole state just before the revision (incl. work/, prototype/, verdict files)\n            └── discarded/           # work/ files discarded in the changed plan<\/code><\/pre>"}]},{"id":".archived/<task-id>/","steps":["R"],"writer":"the person (archive-tasks.py)","comment":"finished tasks moved out of the monitor's list by archive-tasks.py (4.8.2)","sources":[{"title":"archive-tasks.py (docstring)","from":"plugins/my-agent/l4-tools-guards/scripts/archive-tasks.py","html":"<p>Move finished task folders out of the monitor's list (architecture 4.8.2 \"Task records over time\").<\/p><p>usage: archive-tasks.py [--days N] [--dry-run] [--projects FILE] For each project in the project list, a task folder <code>&lt;project&gt;/docs/agent/&lt;task-id&gt;/<\/code> whose <code>intake.md<\/code> says <code>Status: done<\/code> or <code>Status: aborted<\/code>, and whose last run-log line (or <code>intake.md<\/code> change, without a run-log) is N days old or more (default 30), moves to <code>&lt;project&gt;/docs/agent/.archived/&lt;task-id&gt;/<\/code> (<code>-b<\/code>, <code>-c<\/code> … when the name is taken). The task named in that project's <code>.active<\/code> never moves. Before a move, a task without <code>main-usage.json<\/code> gets one (usage-snapshot) while its transcript still exists; a task whose transcript is gone moves anyway. The monitor, the menu bar app and <code>/my-agent status<\/code> read only <code>docs/agent/*/<\/code>, so moved tasks leave them without any change there. To bring a task back, move its folder back to <code>docs/agent/<\/code>. --dry-run prints what would move and changes nothing. The project list is $MA_PROJECTS_FILE, else $MA_TASKS_DIR/projects.txt (default ~/dev/agent-tasks/projects.txt). Transcripts: $MA_CLAUDE_PROJECTS. Run by the person (not by L1). exit: 0 done (also when nothing was due), 2 bad arguments, 3 a move failed.<\/p>"}]}],"vocab":[{"title":"agents (plugin.json lists the same nine; frontmatter `level:` and the folder say the same level)","items":[{"name":"AGENTS","value":"architect L2 · plan-reviewer L2 · verifier L2 · reviewer L2 · gate-analyst L2 · explorer L3 · researcher L3 · writer L3 · coder L3","note":""},{"name":"LEVEL_FOLDER","value":"L2 l2-design-judge · L3 l3-workers","note":""},{"name":"UNIT_AGENTS","value":"researcher · writer · coder","note":"agents that run a plan.md work unit (E: unit stops)"},{"name":"BEFORE_APPROVAL","value":"explorer · architect · plan-reviewer","note":"G1b allow list (4.4, Q6)"}]},{"title":"verdicts: the first line of each judge's file and last message","items":[{"name":"VERIFY_PASS","value":"Verdict: ALL PASS","note":""},{"name":"VERIFY_FAIL","value":"Verdict: FAIL","note":""},{"name":"PLAN_READY","value":"READY FOR APPROVAL","note":""},{"name":"PLAN_REVISE","value":"REVISE","note":""},{"name":"PLAN_SKIPPED","value":"SKIPPED","note":"L1 writes `SKIPPED <reason>` when the profile skips Plan Review"},{"name":"REVIEW_PASS","value":"BLOCKER 0","note":""},{"name":"REVIEW_PREFIX","value":"BLOCKER ","note":""},{"name":"WORKER_DONE","value":"DONE","note":""},{"name":"WORKER_PARTIAL","value":"PARTIAL","note":""},{"name":"APPLIED_AFTER_REVIEW","value":"Applied after review","note":"review.md section L1 adds after a fix that skips re-Verify"}]},{"title":"status values","items":[{"name":"INTAKE_STATUS","value":"active · done · aborted","note":"intake.md `Status:` (first word)"},{"name":"UNIT_STATUS","value":"pending · running · done · stale","note":"plan.md work unit `Status:`"},{"name":"UNIT_FINISHED","value":"done · stale","note":"every unit ends in one of these (check-run)"},{"name":"END","value":"ok · partial · error","note":"stop: end="},{"name":"INTERRUPTED","value":"partial · error","note":"an end that counts as a worker stop (E)"},{"name":"GATES","value":"G1a · G1b · G2 · G3 · E","note":""},{"name":"POPUP_TAGS","value":"G1a · G1b · G2 · G3 · E · Q","note":"Q: an L1 popup that is not a gate"},{"name":"PEOPLE_POPUPS","value":"G1a · G1b · G3 · E · Q","note":"L1 popups (G2 is Claude Code's permission window)"}]},{"title":"models","items":[{"name":"FAMILY","value":"(opus|sonnet|haiku|fable)","note":""}]},{"title":"run-log lines (4.7.2): `<YYYY-MM-DD HH:MM:SS> <kind>: <key=value ...>`","items":[{"name":"LINE_RE","value":"^(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}) ([a-z][a-z0-9-]*):(?:\\s+(.*))?$","note":""},{"name":"STAMPED","value":"^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2} ","note":"looks like a record, readable or not"}]},{"title":"plan.md markers and work units","items":[{"name":"APPROVED","value":"Approved\\s+(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2})","note":"under ## Approval, L1 only"},{"name":"PROTOTYPE","value":"(?m)^\\s*(?:-\\s*)?Prototype:\\s*requested\\s*$","note":"under ## Prototype, L1 only"},{"name":"UNIT_HEAD","value":"^###\\s+(u\\d+)\\b\\s*(.*)$","note":"`### u1 <name>` under ## Work units"},{"name":"UNIT_STATUS_LINE","value":"^\\s*(?:-\\s*)?Status:\\s*([a-z]+)","note":""},{"name":"UNIT_MARK","value":"(?m)^Work unit:\\s*(u\\d+)\\b","note":"first prompt line L1 gives a unit's worker"},{"name":"MOCKUP_KIND","value":"^Kind:\\s*(.*)$","note":"first line of ## Mock-up"},{"name":"DELIVERED_COMMIT","value":"commit:","note":"`Delivered: commit:<sha>` / deliver path="}]}],"skillLevels":"<div class=\"tbl\"><table><thead><tr><th>Level<\/th><th>Who<\/th><th>Does<\/th><th>Does not<\/th><\/tr><\/thead><tbody><tr><td>L1<\/td><td>main session (this skill)<\/td><td>runs phases, delegates, merges, asks all questions, records<\/td><td>make deliverables (code, notes, drafts, plans) itself. Only exception: small fixes a judgment pointed out (2 files or fewer, about 10 lines)<\/td><\/tr><tr><td>L2<\/td><td>architect · plan-reviewer · verifier · reviewer · gate-analyst<\/td><td>plans, judges, interprets decisions<\/td><td>change deliverables, delegate further<\/td><\/tr><tr><td>L3<\/td><td>explorer · researcher · writer · coder<\/td><td>the one work unit assigned<\/td><td>touch files outside the scope, delegate further<\/td><\/tr><tr><td>L4<\/td><td>tools·MCP · hooks · permission rules · scripts<\/td><td>run, record, block<\/td><td>judge<\/td><\/tr><\/tbody><\/table><\/div><ul><li>The monitor and the Claude Code permission dialog (G2) are outside the levels.<\/li><li>L1 hands work to L2 and L3 directly, passing only paths and criteria. Never pass the author's explanation to a judge.<\/li><\/ul>","l1DoesNot":"make deliverables (code, notes, drafts, plans) itself. Only exception: small fixes a judgment pointed out (2 files or fewer, about 10 lines)"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lvClass = id => 'l' + String(id).replace(/\D/g, '');
const agentById = Object.fromEntries(D.agents.map(a => [a.id, a]));
const levelOf = Object.fromEntries(D.levels.flatMap(l => l.comps.map(c => [c.id, l])));
const PROFILES = ['general', 'research', 'dev'];
let profile = 'general';
try { profile = localStorage.getItem('ma-profile') || 'general'; } catch (e) {}

const TICKS = /\x60([^\x60]+)\x60/g;
function src(s, open) {
  return `<details class="src"${open ? ' open' : ''}><summary><span>${esc(s.title).replace(TICKS, '<code>$1</code>')}</span><span class="from">${esc(s.from || '')}</span></summary><div class="md">${s.html}</div></details>`;
}
function sec(title, html, open, from) { return src({ title, html, from }, open); }
function compLink(c, l) {
  return `<a class="comp" href="#levels/${c.id}"><b>${esc(c.name)}</b><small>${esc(c.sub || summary(c.id) || '')}</small></a>`;
}
function levelNote(l) {
  const paren = l.title.match(/\(([^)]*)\)\s*$/);
  return /main session/.test(l.title) ? l.title.split(' · ').slice(1).join(' · ') : paren ? paren[1] : '';
}
const plain = h => h.replace(/\s*\(<strong>[^<]*<\/strong>\)|\s*<strong>\([^<]*\)<\/strong>/g, '');
function summary(id) {
  const a = agentById[id];
  return a ? `${a.model} · ${a.effort}` : '';
}
function stepName(n) {
  if (n === 'R') return 'Retrospective';
  if (n === 'G1b') return 'G1b approval';
  const s = D.steps.find(x => x.n === n);
  return s ? `${n}. ${s.name.replace(/<[^>]+>/g, '')}` : n;
}
function stepChip(n) {
  const href = /^\d$|^R$/.test(n) ? `#flow/${n}` : `#flow/gates`;
  return `<a class="chip" href="${href}">${esc(stepName(n))}</a>`;
}
function artChip(a) { return `<a class="chip" href="#artifacts/${encodeURIComponent(a.id)}">${esc(a.id)}</a>`; }
function writes(agentId) { return D.artifacts.filter(a => a.writer.includes('my-agent:' + agentId)); }

/* ---------- overview ---------- */
function viewOverview() {
  const gates = D.gates.length, steps = D.steps.length;
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1a', '4': 'G1b', '8': 'G3' };
  return `<h1 class="page">How my-agent is put together</h1>
  <p class="lede">${esc(D.description)}. Every value on this page is read from the plugin files of version ${esc(D.version)} (design ${esc(D.design)}) by <code>tools/build-docs.py</code>.</p>
  <div class="kpis">
    <a class="kpi" href="#levels" style="color:inherit;text-decoration:none"><b>${D.levels.length}</b><span>levels</span></a>
    <a class="kpi" href="#levels/L2" style="color:inherit;text-decoration:none"><b>${D.agents.length}</b><span>subagents (L2 ${D.agents.filter(a => a.level === 'L2').length} · L3 ${D.agents.filter(a => a.level === 'L3').length})</span></a>
    <a class="kpi" href="#flow" style="color:inherit;text-decoration:none"><b>${phases.length} · ${steps}</b><span>phases · steps</span></a>
    <a class="kpi" href="#flow/gates" style="color:inherit;text-decoration:none"><b>${gates}</b><span>human gates (${D.gates.map(g => g.id).join(' · ')})</span></a>
  </div>
  <div class="ov-grid">
    <section class="panel"><h2>Four levels <small>select a component for its role and permissions</small></h2>
      <div class="person">The person (user · maintainer) ⇄ L1 Gatekeeper: every question as a choice popup</div>
      ${D.levels.map((l, i) => `<div class="lvbox ${lvClass(l.id)}">
        <div class="lh"><b>${l.id}</b><a href="#levels/${l.id}">${esc(l.name)}</a><span>${esc(levelNote(l))}</span></div>
        <div class="comps">${l.comps.map(c => compLink(c, l)).join('')}</div></div>
        ${i === 0 ? '<div class="arrow-note">↓ L1 delegates to L2 and to L3 directly — paths and criteria only; L2 never manages L3</div>' : ''}
        ${i === 2 ? '<div class="arrow-note">↓ L2 and L3 call L4; L4 shows G2 permission requests to the person</div>' : ''}`).join('')}
    </section>
    <div class="stack">
      <section class="panel"><h2>Four phases, eight steps <small>gates close each phase</small></h2>
        <div class="rail">${phases.map(p => `<div class="ph"><div class="pn">${esc(p)}</div>
          ${D.steps.filter(s => s.phase === p).map(s => `<a class="st" href="#flow/${s.n}"><b>${s.n}</b><span>${plain(s.name)}</span></a>`).join('')}
          <div class="gend">${D.steps.filter(s => s.phase === p && gateAfter[s.n]).map(s => `<a class="badge gate" href="#flow/gates">${gateAfter[s.n]}</a>`).join('')}</div></div>`).join('')}</div>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">G2 (risky action) can appear during any step; E (escalation) hands control to the person when failures repeat.</p>
      </section>
      <section class="panel"><h2>Principles</h2><div class="md">${D.principles}</div></section>
    </div>
  </div>
  <section class="panel"><h2>Delegation paths</h2><div class="md">${D.delegation}</div></section>`;
}

/* ---------- levels ---------- */
function levelsSide(cur) {
  const items = D.levels.map(l => `<a class="lvl ${lvClass(l.id)}" href="#levels/${l.id}" aria-current="${cur === l.id}">${l.id} · ${esc(l.name)}</a>`
    + l.comps.map(c => `<a class="sub ${lvClass(l.id)}" href="#levels/${c.id}" aria-current="${cur === c.id}">${esc(c.name)}${agentById[c.id] ? `<span class="tag">${agentById[c.id].model}</span>` : ''}</a>`).join('')).join('');
  const opts = D.levels.map(l => `<option value="${l.id}"${cur === l.id ? ' selected' : ''}>${l.id} · ${esc(l.name)}</option>`
    + l.comps.map(c => `<option value="${c.id}"${cur === c.id ? ' selected' : ''}>&nbsp;&nbsp;${esc(c.name)}</option>`).join('')).join('');
  return `<aside class="side"><div class="list"><h3>Levels and components</h3>${items}</div>
    <select onchange="location.hash='levels/'+this.value" aria-label="Level or component">${opts}</select></aside>`;
}
function viewLevels(id) {
  id = id || 'L1';
  const lv = D.levels.find(l => l.id === id);
  let body;
  if (lv) body = levelDetail(lv);
  else if (agentById[id]) body = agentDetail(agentById[id]);
  else if (levelOf[id]?.id === 'L1') body = l1Detail(levelOf[id].comps.find(c => c.id === id));
  else if (levelOf[id]?.id === 'L4') body = l4Detail(levelOf[id].comps.find(c => c.id === id));
  else body = `<p>Unknown component <code>${esc(id)}</code>.</p>`;
  return `<div class="split">${levelsSide(id)}<div class="${lvClass((lv || levelOf[id] || {}).id || 'L1')}">${body}</div></div>`;
}
function levelDetail(lv) {
  const cards = lv.comps.map(c => {
    const a = agentById[c.id];
    const tail = a ? `<div class="chips">${a.tools.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
    return `<a class="card ${lvClass(lv.id)}" href="#levels/${c.id}"><b>${esc(c.name)}</b><p>${esc(a ? a.description.replace(/^my-agent L\d [^.]*\.\s*/, '') : c.sub)}</p>${a ? `<p class="mono">${a.model} · effort ${a.effort}${a.maxTurns ? ' · maxTurns ' + a.maxTurns : ''}</p>` : ''}${tail}</a>`;
  }).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">${lv.id}</span><h1>${esc(lv.name)}</h1></div>
    <p class="desc">${esc(lv.title)}</p>
    <div class="kv"><div>Runs in</div><div>${lv.runsIn}</div><div>Information it sees</div><div>${lv.sees}</div>
      <div>Output</div><div>${lv.output}</div><div>What it cannot do</div><div>${lv.cannot}</div></div></div>
    <div class="panel"><h2>Components <small>${lv.comps.length}</small></h2><div class="cards">${cards}</div></div>
    ${lv.id === 'L2' || lv.id === 'L3' ? `<div class="panel"><h2>Read and write scope <small>scope-guard.py, every my-agent:* call</small></h2><div class="md">${D.scopeDoc}</div>${scopeMatrix(D.agents.filter(a => a.level === lv.id))}</div>` : ''}
    ${lv.id === 'L1' ? `<div class="panel"><h2>Level table in SKILL.md</h2><div class="md">${D.skillLevels}</div></div>` : ''}
    ${lv.id === 'L4' ? `<div class="panel"><h2>About the levels</h2><div class="md">${D.levelNotes}</div></div>` : ''}`;
}
function scopeList(xs) { return xs.length ? xs.map(x => `<code>${esc(x)}</code>`).join(' ') : '<span class="muted">nothing</span>'; }
function scopeMatrix(list) {
  return `<div class="tbl"><table><thead><tr><th>Agent</th><th>Reads</th><th>Writes</th><th>Bash writes</th><th>Web</th><th>Before G1b</th></tr></thead><tbody>
    ${list.map(a => `<tr><td><a class="mono" href="#levels/${a.id}">${a.id}</a></td><td>${scopeList(a.scope.read)}</td><td>${scopeList(a.scope.write)}${a.scope.denyWrite.length ? `<br><span class="muted">never: </span>${scopeList(a.scope.denyWrite)}` : ''}</td>
      <td>${a.scope.bashWrites ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td><td>${a.scope.web ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td>
      <td>${a.beforeApproval ? '<span class="badge ok">allowed</span>' : '<span class="badge">after approval</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}
function agentDetail(a) {
  const allTools = D.l4.tools;
  const used = PROFILES.map(p => {
    const u = D.profiles[p].used[a.id];
    return `<tr><td class="mono">${p}</td><td>${u ? u[0] : '<span class="muted">not used</span>'}</td><td>${u ? u[1] : ''}</td></tr>`;
  }).join('');
  const ws = writes(a.id);
  const fmt = a.sections.filter(s => /format|sections/i.test(s.title));
  const rest = a.sections.filter(s => !fmt.includes(s));
  return `<div class="panel"><div class="dhead"><span class="badge lv">${a.level}</span><h1>${esc(a.call)}</h1></div>
    <p class="desc">${esc(a.description)}</p>
    <div class="md">${a.role}</div>
    <div class="facts"><div class="fact"><span>Model</span><b>${esc(a.model)}</b></div><div class="fact"><span>Effort</span><b>${esc(a.effort)}</b></div>
      <div class="fact"><span>maxTurns</span><b>${esc(a.maxTurns || '—')}</b></div>
      <div class="fact"><span>Before G1b approval</span><b>${a.beforeApproval ? 'allowed' : 'blocked'}</b></div>
      <div class="fact"><span>Runs plan work units</span><b>${a.unitAgent ? 'yes (unit=u&lt;n&gt;)' : 'no'}</b></div></div>
    <p class="muted mono" style="font-size:11.5px;margin:8px 0 0">${esc(a.file)}</p></div>
  <div class="panel"><h2>Permissions <small>tools from the definition frontmatter; paths enforced by scope-guard.py</small></h2>
    <div class="chips" style="margin-bottom:10px">${allTools.map(t => `<span class="chip ${a.tools.includes(t) ? '' : 'off'}">${esc(t)}</span>`).join('')}<span class="chip off">Agent</span></div>
    <div class="tbl"><table><tbody>
      <tr class="scope-row"><td>Reads</td><td>${scopeList(a.scope.read)}</td></tr>
      <tr class="scope-row"><td>Writes</td><td>${scopeList(a.scope.write)}</td></tr>
      ${a.scope.denyWrite.length ? `<tr class="scope-row"><td>Never writes</td><td>${scopeList(a.scope.denyWrite)}</td></tr>` : ''}
      <tr class="scope-row"><td>Bash that writes</td><td>${a.scope.bashWrites ? 'allowed' : 'blocked (read and check commands only)'}</td></tr>
      <tr class="scope-row"><td>Web</td><td>${a.scope.web ? 'allowed' : 'blocked'}</td></tr>
      <tr class="scope-row"><td>Secret files</td><td>blocked for every agent — <code>deny</code> rules: ${D.l4.deny.filter(x => x.startsWith('Read(')).map(x => `<code>${esc(x)}</code>`).join(' ')}</td></tr>
      <tr class="scope-row"><td>Delegate further</td><td>no — the <code>Agent</code> tool is left out of every definition</td></tr>
    </tbody></table></div></div>
  <div class="panel"><h2>Where it is used <small>"Agents used" in each profile file</small></h2>
    <div class="tbl"><table><thead><tr><th>Profile</th><th>Steps</th><th>Result</th></tr></thead><tbody>${used}</tbody></table></div>
    ${ws.length ? `<p style="margin:8px 0 0"><span class="muted">Deliverables: </span>${ws.map(artChip).join(' ')}</p>` : ''}</div>
  <div class="panel"><h2>Definition <small>sections of the agent file</small></h2>
    ${fmt.map(s => sec(s.title, s.html, true, 'output format')).join('')}
    ${rest.map(s => sec(s.title, s.html, s.title === 'Rules' || s.title === 'Input' || s.title === 'When done')).join('')}</div>`;
}
function l1Detail(c) {
  const d = D.l1[c.id] || { leads: [], sources: [] };
  const steps = d.leads.map(n => D.steps.find(s => s.n === n));
  return `<div class="panel"><div class="dhead"><span class="badge lv">L1</span><h1>${esc(c.name)}</h1></div>
    <p class="desc">${esc(c.sub)} · runs inside the main session as part of the my-agent skill</p>
    ${steps.length ? `<p><span class="muted">Leads steps: </span>${steps.map(s => stepChip(s.n)).join(' ')}</p>` : ''}
    <p class="muted" style="font-size:12.5px"><span class="muted">Does not: </span>${D.l1DoesNot}</p></div>
    <div class="panel"><h2>Rules</h2>${d.sources.map(s => src(s, true)).join('')}
    ${steps.map(s => s.rules.map(r => src({ ...r, title: `Step ${s.n} · ${r.title}` }, false)).join('')).join('')}</div>`;
}
function l4Detail(c) {
  const L = D.l4;
  if (c.id === 'hooks') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>hooks</h1></div><p class="desc">${esc(c.sub)}</p>
      <div class="tbl"><table><thead><tr><th>Event</th><th>Matcher</th><th>Script</th><th>Where</th><th>On failure</th><th>What it does</th></tr></thead><tbody>
      ${L.hooks.map(h => `<tr><td class="mono">${esc(h.event)}</td><td><code>${esc(h.matcher)}</code></td><td class="mono">${esc(h.script)} ${esc(h.arg)}</td><td>${esc(h.where)}</td><td>${h.onFailure === 'block' ? '<span class="badge no">block</span>' : '<span class="badge">exit 0</span>'}</td><td>${esc(h.doc)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><h2>G1b hard gate</h2><div class="md">${L.hardGate}</div></div>`;
  }
  if (c.id === 'permission-rules') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>permission rules</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/permissions/permissions.json</code>, merged by hand into <code>~/.claude/settings.json</code></p>
      <div class="two"><div><h3 style="font-size:13px;margin-bottom:6px">ask <span class="badge gate">G2</span></h3><div class="chips">${L.ask.map(x => `<code>${esc(x)}</code>`).join('')}</div></div>
      <div><h3 style="font-size:13px;margin-bottom:6px">deny</h3><div class="chips">${L.deny.map(x => `<code>${esc(x)}</code>`).join('')}</div></div></div></div>
      <div class="panel"><h2>What G2 asks about</h2><div class="md">${L.g2}</div></div>`;
  }
  if (c.id === 'scripts') {
    const list = xs => `<div class="tbl"><table><tbody>${xs.map(s => `<tr><td class="mono" style="white-space:nowrap">${esc(s.name)}</td><td>${esc(s.doc)}</td></tr>`).join('')}</tbody></table></div>`;
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>scripts</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/scripts/</code></p>${list(L.scripts)}</div>
      <div class="panel"><h2>Shared library <small>l4-tools-guards/lib/ — used by hooks, scripts and the monitor</small></h2>${list(L.lib)}</div>`;
  }
  const head = `<tr><th>Agent</th>${L.tools.map(t => `<th>${esc(t)}</th>`).join('')}<th>Agent</th></tr>`;
  const rows = D.agents.map(a => `<tr><td><a href="#levels/${a.id}">${a.call}</a></td>${L.tools.map(t => a.tools.includes(t) ? '<td class="yes">●</td>' : '<td class="nope">·</td>').join('')}<td class="nope">·</td></tr>`).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>${esc(c.name)}</h1></div><p class="desc">Built-in tools and MCP servers run what the agents ask for. Which tools each subagent may call is fixed in its definition frontmatter (<code>tools:</code>); no definition has <code>Agent</code>, so no subagent can delegate.</p>
    <div class="tbl"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>
    <div class="panel"><h2>What limits the tools</h2><div class="md">${D.scopeDoc}</div></div>`;
}

/* ---------- flow ---------- */
function viewFlow(sub) {
  const P = D.profiles[profile];
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1a', '4': 'G1b', '8': 'G3' };
  const gateById = Object.fromEntries(D.gates.map(g => [g.id, g]));
  const agentsIn = n => Object.entries(P.used).filter(([, u]) => new RegExp(`(^|[^0-9])${n}([^0-9]|$)`).test(u[0].replace(/<[^>]+>/g, ''))).map(([id]) => id);
  const stepCard = s => {
    const lvl = (s.level.match(/L\d/) || ['L1'])[0];
    const arts = D.artifacts.filter(a => a.steps.length <= 3 && (a.steps.includes(s.n) || (s.n === '4' && a.steps.includes('G1b'))));
    const ag = s.n === 'R' ? ['gate-analyst'] : agentsIn(s.n);
    const lines = (s[profile] !== undefined) ? `<div class="row"><span>${esc(profile)} profile</span><div>${s[profile]}</div></div>` : '';
    return `<article class="step ${lvClass(lvl)}${sub === s.n ? ' hl' : ''}" id="step-${s.n}">
      <div class="sh"><span class="n">${s.n === 'R' ? '↺' : s.n}</span><h3>${s.name}</h3><span class="badge lv">${esc(s.level)}</span></div>
      ${s.what ? `<div class="row"><span>What it does</span><div>${s.what}</div></div>` : ''}${lines}
      ${ag.length ? `<div class="row"><span>Agents</span><div class="chips">${ag.map(id => `<a class="chip" href="#levels/${id}">my-agent:${id}</a>`).join('')}</div></div>` : ''}
      ${arts.length ? `<div class="row"><span>Deliverables</span><div class="chips">${arts.map(artChip).join('')}</div></div>` : ''}
      ${s.rules.map(r => src({ ...r, title: 'L1 procedure · ' + r.title }, false)).join('')}</article>`;
  };
  const gateBar = id => { const g = gateById[id]; return g ? `<div class="gatebar"><b>${id}</b><span>${g.gate.replace(/^<strong>|<\/strong>$/g, '')} — ${g.choices}</span><a href="#flow/gates" style="margin-left:auto;font-size:12px">details</a></div>` : ''; };
  return `<h1 class="page">Steps, gates and profiles</h1>
  <p class="lede">The 8 steps run in pairs as 4 phases, and each phase ends at a gate. Pick a profile to see what changes.</p>
  <div class="toolbar"><div class="seg" role="group" aria-label="Profile">${PROFILES.map(p => `<button type="button" data-prof="${p}" aria-pressed="${p === profile}">${p}</button>`).join('')}</div>
    <span class="muted" style="font-size:12.5px">${esc(P.title)} · <a href="#artifacts/run-log.md">run-log.md</a> gets lines in every step</span></div>
  <section class="panel"><h2>Overview <small>architecture 4.3</small></h2><pre class="code flowtext"><code>${esc(D.flow)}</code></pre><div class="md">${P.intro}</div></section>
  ${phases.map(p => `<section class="phase-block"><h2>${esc(p)}</h2>${D.steps.filter(s => s.phase === p).map(s => stepCard(s) + (gateAfter[s.n] ? gateBar(gateAfter[s.n]) : '')).join('')}${p === phases[phases.length - 1] ? stepCard(D.retro) : ''}</section>`).join('')}
  <section class="panel" id="step-gates" style="scroll-margin-top:110px"><h2>HITL gates <small>architecture 4.4</small></h2>
    <div class="tbl"><table><thead><tr><th>Gate</th><th>When</th><th>Enforcement</th><th>What the person sees</th><th>Choices</th></tr></thead><tbody>
    ${D.gates.map(g => `<tr><td>${g.gate}</td><td>${g.when}</td><td>${g.enforcement}</td><td>${g.sees}</td><td>${g.choices}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Rules per phase · ${esc(profile)} <small>${esc(P.file)}</small></h2>
    <div class="tbl"><table><thead><tr><th>Step</th><th>Rule</th></tr></thead><tbody>${P.rules.map(r => `<tr><td style="white-space:nowrap">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Skipping and combining</h2><div class="md">${D.skip}</div></section>`;
}

/* ---------- artifacts ---------- */
function viewArtifacts(id) {
  id = id ? decodeURIComponent(id) : 'plan.md';
  const a = D.artifacts.find(x => x.id === id) || D.artifacts[0];
  const top = D.artifacts.filter(x => x.id.startsWith('.'));
  const inTask = D.artifacts.filter(x => !x.id.startsWith('.'));
  const link = x => `<a href="#artifacts/${encodeURIComponent(x.id)}" aria-current="${x.id === a.id}">${esc(x.id)}<span class="tag">${x.steps.length > 3 ? 'all' : x.steps.join(' ')}</span></a>`;
  const opts = D.artifacts.map(x => `<option value="${encodeURIComponent(x.id)}"${x.id === a.id ? ' selected' : ''}>${esc(x.id)}</option>`).join('');
  const agents = D.agents.filter(g => a.writer.includes('my-agent:' + g.id));
  return `<div class="split"><aside class="side"><div class="list tree"><h3>&lt;task location&gt;/docs/agent/</h3>${top.map(link).join('')}
      <div class="root">&lt;task-id&gt;/</div>${inTask.map(link).join('')}</div>
      <select onchange="location.hash='artifacts/'+this.value" aria-label="File">${opts}</select></aside>
    <div><div class="panel"><div class="dhead"><h1>${esc(a.id)}</h1></div>
      ${a.comment ? `<p class="desc">${a.comment}</p>` : ''}
      <div class="kv"><div>Written by</div><div>${esc(a.writer)} ${agents.map(g => `<a class="chip" href="#levels/${g.id}">${g.call}</a>`).join(' ')}</div>
        <div>Steps</div><div class="chips">${a.steps.map(stepChip).join('')}</div>
        <div>Path</div><div><code>${esc(a.id.startsWith('.') ? `<task location>/docs/agent/${a.id}` : `<task location>/docs/agent/<task-id>/${a.id}`)}</code></div></div></div>
      <div class="panel"><h2>Format and rules <small>${a.sources.length} source${a.sources.length > 1 ? 's' : ''}</small></h2>${a.sources.map(s => src(s, true)).join('') || '<p class="muted">No format is written down for this file.</p>'}</div></div></div>`;
}

/* ---------- shared words ---------- */
function viewVocab() {
  return `<h1 class="page">Shared words and shapes</h1>
  <p class="lede">The words hooks, scripts and the monitor parse — verdict lines, status values, gate names, run-log line shape, plan.md markers. They live in one place, <code>l4-tools-guards/lib/ma_schema.py</code>, and <code>test_schema.py</code> checks that each agent definition still spells them.</p>
  ${D.vocab.map(g => `<section class="panel"><h2>${esc(g.title)}</h2><div class="tbl"><table><thead><tr><th>Name</th><th>Value</th><th>Note</th></tr></thead><tbody>
    ${g.items.map(i => `<tr><td class="mono" style="white-space:nowrap">${esc(i.name)}</td><td><code>${esc(i.value)}</code></td><td>${esc(i.note)}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}`;
}

/* ---------- router ---------- */
function route() {
  const [view, sub] = (location.hash.replace(/^#/, '') || 'overview').split('/');
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'].includes(view) ? view : 'overview';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
  $('main').innerHTML = { overview: viewOverview, levels: viewLevels, flow: viewFlow, artifacts: viewArtifacts, vocab: viewVocab }[v](sub);
  if (v === 'flow' && sub) { const el = $('step-' + sub); if (el) el.scrollIntoView({ block: 'start' }); }
  else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-prof]');
  if (!b) return;
  profile = b.dataset.prof;
  try { localStorage.setItem('ma-profile', profile); } catch (err) {}
  const y = window.scrollY; route(); window.scrollTo(0, y);
});
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('ma-theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('theme').textContent = 'Theme: ' + theme;
}
$('theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem('ma-theme', theme); } catch (e) {}
  applyTheme();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'][+e.key - 1];
  if (v) location.hash = v;
});
$('ver').textContent = `plugin ${D.version} · design ${D.design}`;
applyTheme();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
