<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-agent monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --t1: #8fb0ff; --t2: #e8b45c; --t3: #5fd0ae; --t4: #b4bdc8;
  --bg: #eef1f4; --surface: #fff; --surface-2: #f6f8fa; --ink: #17202a; --muted: #5a6674; --line: #d3dae2;
  --accent: #2552c9;
  --l1: #2552c9; --l1-soft: #e3eafb; --l2: #a86a10; --l2-soft: #f8edda;
  --l3: #17806a; --l3-soft: #dcf1ea; --l4: #5d6775; --l4-soft: #e7eaee;
  --gate: #c43d12; --gate-soft: #fbe5dc; --ok: #1d7a3e; --ok-soft: #dff2e5; --run: #2552c9;
  --term-bg: #121a23; --term-ink: #d8e1ea; --term-dim: #7f8d9c;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a232d; --ink: #e4eaf0; --muted: #93a1b0; --line: #2a3542;
  --accent: #7ea3ff; --l1: #7ea3ff; --l1-soft: #1c2a47; --l2: #e2aa4f; --l2-soft: #3a2c14;
  --l3: #4cc5a3; --l3-soft: #133a31; --l4: #a3adba; --l4-soft: #262f3a;
  --gate: #ff8a5c; --gate-soft: #3e2016; --ok: #5fd08a; --ok-soft: #143222; --run: #7ea3ff;
  --term-bg: #0a0f14; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
code, .mono { font-family: var(--mono); font-size: .9em; }
button { font: inherit; color: inherit; cursor: pointer; }
h2, h3 { margin: 0; line-height: 1.3; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
.top .live { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot.run { background: var(--run); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.task-select { display: none; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 50px); }
aside.tasks { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; }
aside.tasks h3 { font-size: 12px; letter-spacing: .06em; color: var(--muted); padding: 0 8px 8px; }
.filter { display: flex; gap: 4px; padding: 0 6px 10px; flex-wrap: wrap; }
.filter button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
.filter button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.titem { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 4px; }
.titem:hover { background: var(--surface-2); }
.titem[aria-current="true"] { background: var(--l1-soft); border-color: var(--l1); }
.titem .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.titem .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.titem .mini-rail { display: flex; gap: 2px; margin-top: 5px; }
.titem .mini-rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.titem .mini-rail i.done { background: var(--ok); }
.titem .mini-rail i.cur { background: var(--run); }
.titem .mini-rail i.stop { background: var(--gate); }
.badge { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.run { color: var(--run); border-color: var(--run); }
.badge.wait { color: var(--gate); border-color: var(--gate); background: var(--gate-soft); }
.badge.done { color: var(--ok); border-color: var(--ok); }
.badge.stop { color: var(--gate); border-color: var(--gate); }

main { padding: 16px 20px 60px; min-width: 0; }
.task-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 12px; }
.task-head h2 { font-family: var(--mono); font-size: 19px; }
.task-head .t { color: var(--muted); }
.task-head .where { font-size: 12px; color: var(--muted); width: 100%; }
nav.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 7px 12px; color: var(--muted); font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs .k { font-family: var(--mono); font-size: 11px; margin-right: 5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.panel > .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.panel > .ph h3 { font-size: 14px; }
.panel > .ph small { color: var(--muted); font-size: 12px; }

/* layouts */
.panels { display: grid; gap: 14px; }
body.lay-a .panel[data-view]:not(.on) { display: none; }
body.lay-b aside.tasks, body.lay-c aside.tasks { display: none; }
body.lay-b .shell, body.lay-c .shell { grid-template-columns: minmax(0, 1fr); }
body.lay-b .task-select, body.lay-c .task-select { display: inline-block; }
body.lay-b nav.tabs, body.lay-c nav.tabs { display: none; }
body.lay-b .panels { grid-template-columns: 1fr 1fr 1.3fr; }
body.lay-b .panel[data-view="status"] { grid-column: 1 / -1; }
body.lay-b .arch-grid { grid-template-columns: 1fr; }
body.lay-b .lv .chips { grid-template-columns: 1fr 1fr; }
body.lay-b .log-wrap { max-height: 520px; overflow: auto; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; } aside.tasks { display: none; } .task-select { display: inline-block; }
  body.lay-b .panels { grid-template-columns: 1fr; }
}

/* status panel */
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.phase { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.phase.done { border-color: var(--ok); }
.phase.cur { border-color: var(--run); box-shadow: 0 0 0 2px var(--l1-soft); }
.phase .pn { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
.steps { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.step { font-size: 12px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.step b { font-family: var(--mono); font-weight: 500; width: 14px; }
.step.done { color: var(--ink); } .step.done::before { content: "✓"; color: var(--ok); width: 10px; }
.step.cur { color: var(--run); font-weight: 600; } .step.cur::before { content: "▶"; width: 10px; font-size: 10px; }
.step.todo::before, .step.skip::before { content: "·"; width: 10px; }
.step.skip { text-decoration: line-through; }
.gate-lamp { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.gate-lamp.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.gate-lamp.wait { border-color: var(--gate); color: var(--gate); background: var(--gate-soft); animation: pulse 1.4s infinite; }
.now { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 760px) { .now { grid-template-columns: 1fr; } .rail { grid-template-columns: 1fr 1fr; } }
.now-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.now-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.detail-col .agent-row, .side .agent-row { grid-template-columns: auto minmax(0, 1fr); } .detail-col .agent-row .tm, .side .agent-row .tm { grid-column: 2; text-align: left; }
.agent-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.agent-row:first-of-type { border-top: 0; }
.agent-row .nm { font-family: var(--mono); font-size: 12.5px; }
.agent-row .sub { color: var(--muted); font-size: 12px; }
.agent-row .tm { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.wait-box { border: 1px solid var(--gate); background: var(--gate-soft); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.bar.live i { background: repeating-linear-gradient(45deg, var(--accent) 0 8px, color-mix(in srgb, var(--accent) 65%, var(--surface)) 8px 16px); background-size: 22px 22px; animation: stripes .7s linear infinite; }
.bar.warn i { background-color: var(--l2); } .bar.bad i { background: var(--gate); }
.bar.ok i { background: var(--ok); }
@keyframes stripes { to { background-position: 22px 0; } }
.fnew { font-weight: 600; background: linear-gradient(90deg, var(--accent), var(--l3), var(--l2), var(--accent)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad 3s linear infinite; }
.fnew.typing::after { content: "▍"; color: var(--accent); -webkit-text-fill-color: var(--accent); animation: caret .7s step-end infinite; }
@keyframes grad { to { background-position: -300% 0; } }
@keyframes caret { 50% { opacity: 0; } }
.mock { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; }
.mock h5 { margin: 0 0 6px; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mock pre { margin: 0; background: var(--term-bg); color: var(--term-ink); border-radius: 6px; padding: 8px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
.diff .dl { display: block; padding: 0 6px; border-radius: 3px; }
body.entering .diff .dl, .diff.fresh .dl { animation: rise .35s backwards; animation-delay: calc(var(--i) * 40ms); }
.diff .dl.add { background: color-mix(in srgb, var(--ok) 30%, transparent); }
.diff .dl.del { background: color-mix(in srgb, var(--gate) 30%, transparent); text-decoration: line-through; }
.fsplit { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.fside { position: sticky; top: 64px; } .fside .preview, .fside .mock { margin-top: 0; } .fside .preview { max-height: calc(100vh - 140px); min-height: 220px; }
@media (max-width: 860px) { .fsplit { grid-template-columns: 1fr; } .fside { position: static; } }
.lvcard { display: flex; flex-direction: column; gap: 5px; }
.lvw { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; border-left: 3px solid var(--c); background: var(--soft); border-radius: 5px; padding: 5px 8px; font-size: 12.5px; }
.lvw > b { font-family: var(--mono); color: var(--c); grid-row: span 2; }
.lvw .ln2 { font-size: 11px; color: var(--muted); }
.lvw .items { display: flex; flex-direction: column; gap: 2px; }
.lvw .items code { font-size: 11px; background: var(--surface); }
.lvw .tm2 { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.lvw .none { color: var(--muted); opacity: .7; }
body.entering .lvw, .lvw.fresh { animation: rise .35s backwards; }
.kpis { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi .kl { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.kpi .kv2 { font: 600 18px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .kv2.ok { color: var(--ok); } .kpi .kv2.warn { color: var(--l2); } .kpi .kv2.bad { color: var(--gate); }
.kpi .ks { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .bar { margin: 2px 0 0; }
.dash { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .dash { grid-template-columns: 1fr; } }
.p2h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 13px; } .p2h small { color: var(--muted); font-size: 11.5px; }
.ltag { font-weight: 600; } .ltag.t1 { color: var(--t1); } .ltag.t2 { color: var(--t2); } .ltag.t3 { color: var(--t3); } .ltag.t4 { color: var(--t4); }
.lvbadge { font: 600 11px var(--mono); padding: 0 6px; border-radius: 4px; color: var(--c); background: var(--soft); border: 1px solid var(--c); white-space: nowrap; }
.sum-box { display: flex; flex-direction: column; gap: 7px; }
.srow { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.srow .sl { color: var(--muted); font-size: 12px; }
.srow .sv { font-family: var(--mono); font-size: 12.5px; text-align: right; } .srow .sv small { color: var(--muted); font-family: var(--sans); }
.srow:last-child { grid-template-columns: 66px minmax(0, 1fr); } .srow:last-child .sv { text-align: left; }
.cells { display: flex; gap: 3px; } .cells i { flex: 1; height: 10px; border-radius: 3px; background: var(--line); }
.cells i.pass { background: var(--ok); animation: pop .5s backwards; } .cells i.fail { background: var(--gate); }
.cells i.run { background: linear-gradient(90deg, var(--line) 25%, var(--l1-soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 2 / -1; }
.pill { font: 11.5px var(--mono); padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.warn { border-color: var(--l2); color: var(--l2); } .pill.bad { border-color: var(--gate); color: var(--surface); background: var(--gate); }
.gauge { display: grid; grid-template-columns: 110px minmax(0, 1fr) 92px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.gauge .gv { font-family: var(--mono); font-size: 12px; text-align: right; }
.gauge .bar { margin: 0; }
.crit { display: flex; gap: 3px; margin-top: 6px; }
.crit span { flex: 1; height: 18px; border-radius: 4px; background: var(--line); display: grid; place-items: center; font: 600 10.5px var(--mono); color: var(--muted); }
.crit span.pass { background: var(--ok); color: var(--surface); animation: pop .5s backwards; }
.crit span.fail { background: var(--gate); color: var(--surface); }
.crit span.run { background: linear-gradient(90deg, var(--line) 25%, var(--l1-soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes shimmer { to { background-position: -200% 0; } }
/* running step: pulse ring + shimmer */
.vs.cur .no { animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.vs.cur { background: linear-gradient(90deg, var(--surface) 30%, var(--l1-soft) 50%, var(--surface) 70%); background-size: 250% 100%; animation: shimmer 2.6s linear infinite; }
.dots3 { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots3 i { width: 5px; height: 5px; border-radius: 50%; background: var(--run); animation: bounce 1s ease-in-out infinite; }
.dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
/* entrance */
body.entering .panel.on .now-box, body.entering .panel.on .vs, body.entering .panel.on .vph, body.entering .panel.on .vgate, body.entering .panel.on .lv, body.entering .panel.on .frow { animation: rise .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.num { font-variant-numeric: tabular-nums; }
/* ripple */
button { position: relative; overflow: hidden; }
.rpl { position: absolute; border-radius: 50%; background: color-mix(in srgb, var(--accent) 35%, transparent); transform: scale(0); animation: rpl .6s ease-out forwards; pointer-events: none; }
@keyframes rpl { to { transform: scale(1); opacity: 0; } }
/* timeline */
.tl { position: relative; font-size: 12px; }
.tl-axis { position: relative; height: 18px; margin-left: 170px; border-bottom: 1px solid var(--line); font: 10.5px var(--mono); color: var(--muted); }
.tl-axis span { position: absolute; transform: translateX(-50%); }
.tl-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); align-items: center; min-height: 26px; border-bottom: 1px dashed var(--line); }
.tl-band { opacity: .7; } .tl-row .tl-mark { opacity: .35; }
.tl-row .lb { font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.tl-row .lb small { color: var(--muted); font-family: var(--sans); }
.tl-track { position: relative; height: 26px; }
.tl-bar { position: absolute; top: 6px; height: 14px; border-radius: 4px; background: var(--c, var(--accent)); transform-origin: left; min-width: 4px; cursor: pointer; transition: width .6s ease; }
body.entering .tl-bar { animation: grow .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.tl-bar.live { background: repeating-linear-gradient(45deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 60%, var(--surface)) 6px 12px); background-size: 17px 17px; animation: stripes .7s linear infinite; }
body.entering .tl-bar.live { animation: grow .8s backwards, stripes .7s linear infinite; }
.tl-bar.mm { outline: 2px solid var(--gate); outline-offset: 1px; }
@keyframes grow { from { transform: scaleX(0); } }
.tl-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gate); }
.tl-mark b { position: absolute; top: -2px; left: 3px; font: 600 10px var(--mono); color: var(--gate); white-space: nowrap; }
.tl-band { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tl-band span { position: absolute; top: 2px; left: 3px; font: 10px var(--mono); color: var(--muted); }
.tl-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 0; }
.tl-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.mm-tag { font: 600 10.5px var(--mono); color: var(--surface); background: var(--gate); border-radius: 4px; padding: 0 5px; }
.console .ln.mm { color: #ffb79b; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; }

/* architecture */
.arch-grid { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 320px); gap: 14px; justify-content: start; align-items: start; }
@media (max-width: 900px) { .arch-grid { grid-template-columns: 1fr; } }
.lv { border-left: 4px solid var(--c); background: var(--soft); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.lv1 { --c: var(--l1); --soft: var(--l1-soft); } .lv2 { --c: var(--l2); --soft: var(--l2-soft); }
.lv3 { --c: var(--l3); --soft: var(--l3-soft); } .lv4 { --c: var(--l4); --soft: var(--l4-soft); }

  const t = cur();
  if (!t || t.error) {
    $('task-head').innerHTML = t ? `<h2>${esc(t.id)}</h2><span class="where"><code>${esc(t.project)}/docs/agent/${esc(t.id)}/</code></span>` : '';
    $('p-status').innerHTML = t ? `<div class="now-box"><h4>${L('Could not read this task', '이 작업을 읽을 수 없음')}</h4><p class="note">${esc(t.error)}</p></div>`
      : `<p class="note">${st.offline ? L('Server not reachable', '서버에 연결할 수 없음') : L('No tasks yet.', '아직 작업이 없습니다.')}</p>`;
    ['p-arch', 'p-files', 'p-log'].forEach(id => $(id).innerHTML = '');
  } else { renderHead(); renderStatus(); renderArch(); renderFiles(); renderLog(); }
  document.querySelectorAll('.panel[data-view]').forEach(p => p.classList.toggle('on', p.dataset.view === st.tab));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === st.tab));
  afterRender();
}
function afterRender() { stagger(); setBars(); runCountUps(); }
let entT;
function entering() { document.body.classList.add('entering'); clearTimeout(entT); entT = setTimeout(() => document.body.classList.remove('entering'), 900); }
const vt = fn => document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches ? document.startViewTransition(fn) : fn();

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.task) { selectTask(b.dataset.task); }
  else if (b.dataset.tab) { st.tab = b.dataset.tab; entering(); vt(() => renderAll()); }
  else if (b.dataset.lang) { LANG = b.dataset.lang; try { localStorage.setItem('ma-lang', LANG); } catch (x) {} lastTyped = ''; vt(() => renderAll()); }
  else if (b.dataset.compwin) openCompWin();
  else if (b.dataset.side) { st.sideMin = !st.sideMin; try { localStorage.setItem('ma-side-min', st.sideMin ? '1' : '0'); } catch (x) {} vt(() => renderList()); }
  else if (b.dataset.f) { st.filter = b.dataset.f; document.querySelectorAll('#filter button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderList(); }
  else if (b.dataset.comp) { st.comp = b.dataset.comp; renderArch(); }
  else if (b.dataset.file) { st.file = b.dataset.file; entering(); renderFiles(); }
  else if (b.dataset.rev != null && b.dataset.rev !== '') { st.rev = +b.dataset.rev; renderStatus(); afterRender(); }
  else if (b.dataset.mode) { st.mode = b.dataset.mode; entering(); vt(() => { renderLog(); afterRender(); }); }
  else if (b.dataset.rp) { const r = b.dataset.rp;
    if (r === 'first') rpGo(0); else if (r === 'prev') rpGo(st.ri - 1); else if (r === 'next') rpGo(st.ri + 1);
    else togglePlay(); }
  else if (b.dataset.speed) { st.speed = +b.dataset.speed; if (st.playing) { st.playing = false; togglePlay(); } else renderLog(); }
});
/* Dashboard step → Log replay at that step's first record */
document.addEventListener('click', e => { const s = e.target.closest('[data-step]'); if (!s || e.target.closest('button')) return; const t = cur();
  const R = st.rev == null || st.rev > latestRev(t) ? latestRev(t) : st.rev, n = +s.dataset.step;
  let k = t.log.findIndex(x => x.s === n && rOf(x) === R); if (k < 0) k = t.log.findIndex(x => x.s === n);
  if (k < 0) return; st.tab = 'log'; st.mode = 'replay'; st.ri = k; entering(); vt(() => renderAll()); });
document.addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (!b) return; st.mode = 'replay'; st.ri = +b.dataset.jump; vt(() => { renderLog(); afterRender(); }); });
/* drag the sidebar edge to resize (200–480px) */
$('resizer').addEventListener('pointerdown', e => { const r = e.currentTarget; try { r.setPointerCapture(e.pointerId); } catch (x) {} r.classList.add('drag'); document.body.classList.add('resizing');
  const move = ev => document.documentElement.style.setProperty('--side-w', Math.max(200, Math.min(480, ev.clientX)) + 'px');
  const up = ev => { r.removeEventListener('pointermove', move); r.removeEventListener('pointerup', up); r.classList.remove('drag'); document.body.classList.remove('resizing');
    try { localStorage.setItem('ma-side-w', Math.max(200, Math.min(480, ev.clientX))); } catch (x) {} };
  r.addEventListener('pointermove', move); r.addEventListener('pointerup', up); });
$('resizer').addEventListener('dblclick', () => { document.documentElement.style.removeProperty('--side-w'); try { localStorage.removeItem('ma-side-w'); } catch (x) {} });
/* ripple */
document.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (!b || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = b.getBoundingClientRect(), sz = Math.max(r.width, r.height) * 2, sp = document.createElement('span'); sp.className = 'rpl';
  sp.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX - r.left - sz / 2}px;top:${e.clientY - r.top - sz / 2}px`; b.appendChild(sp); sp.addEventListener('animationend', () => sp.remove()); });
document.addEventListener('click', e => { const s = e.target.closest('[data-rpstep]'); if (!s) return; const k = cur().log.findIndex(x => x.s >= +s.dataset.rpstep); if (k >= 0) rpGo(k); });
document.addEventListener('input', e => { if (e.target.id === 'rp-range') rpGo(+e.target.value); });
$('task-select').addEventListener('change', e => selectTask(e.target.value));


/* ---------- live data: poll the local server every 2 s ---------- */
const POLL_MS = 2000;
let lastSig = '';
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); }
async function loadTask(key) {
  const t = await getJSON('/api/tasks/' + encodeURIComponent(key).replace(/%2F/g, '/'));
  const old = FULL[key];
  if (old && old.log && t.log) {   /* follow the newest record only if replay was already at the end */
    const seen = new Set(old.log.map(e => e.ts + e.k + e.tx));
    t.log.forEach(e => { e.isNew = !seen.has(e.ts + e.k + e.tx); });
    if (key === st.task && !st.playing && st.ri === old.log.length - 1 && t.log.length > old.log.length) st.ri = t.log.length - 1;
  }
  FULL[key] = t;
  return t;
}
async function poll() {
  try {
    const data = await getJSON('/api/tasks');
    TASKS = data.tasks;
    if (!TASKS.some(t => t.key === st.task)) st.task = (TASKS.find(t => t.status === 'running') || TASKS[0] || {}).key || null;
    if (st.task) await loadTask(st.task);
    st.offline = false;
  } catch (err) { st.offline = true; }
  st.liveWait = TASKS.some(t => t.status === 'running' && t.waiting);
  const sig = JSON.stringify([TASKS, st.task && FULL[st.task], st.offline]);
  if (sig !== lastSig) { const first = !lastSig; lastSig = sig; if (first) entering(); renderAll(); if (first) setTimeout(() => scramble(document.querySelector('#task-head h2')), 30); }
}
async function selectTask(key) {
  st.task = key; st.ri = 0; st.rev = null;
  if (!FULL[key]) { try { await loadTask(key); } catch (err) { st.offline = true; } }
  lastSig = JSON.stringify([TASKS, FULL[key], st.offline]);
  entering(); vt(() => renderAll()); setTimeout(() => scramble(document.querySelector('#task-head h2')), 30);
}
const hashTask = /^#task=(.+)$/.exec(location.hash);   // monitor-up.py --task: open on that task
if (hashTask) try { st.task = decodeURIComponent(hashTask[1]); } catch (err) {}
poll(); setInterval(poll, POLL_MS);
</script>
