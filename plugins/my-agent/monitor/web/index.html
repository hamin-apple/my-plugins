<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-agent monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --t1: #8fb0ff; --t2: #e8b45c; --t3: #5fd0ae; --t4: #b4bdc8;
  --bg: #eef1f4; --surface: #fff; --surface-2: #f6f8fa; --ink: #17202a; --muted: #5a6674; --line: #d3dae2;
  --accent: #2552c9;
  --l1: #2552c9; --l1-soft: #e3eafb; --l2: #a86a10; --l2-soft: #f8edda;
  --l3: #17806a; --l3-soft: #dcf1ea; --l4: #5d6775; --l4-soft: #e7eaee;
  --gate: #c43d12; --gate-soft: #fbe5dc; --ok: #1d7a3e; --ok-soft: #dff2e5; --run: #2552c9;
  --st-run: #c25e00; --st-wait: #d1242f; --st-done: #2552c9; --st-stop: #4b5563; --st-past: #1d7a3e;
  --term-bg: #121a23; --term-ink: #d8e1ea; --term-dim: #7f8d9c;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a232d; --ink: #e4eaf0; --muted: #93a1b0; --line: #2a3542;
  --accent: #7ea3ff; --l1: #7ea3ff; --l1-soft: #1c2a47; --l2: #e2aa4f; --l2-soft: #3a2c14;
  --l3: #4cc5a3; --l3-soft: #133a31; --l4: #a3adba; --l4-soft: #262f3a;
  --gate: #ff8a5c; --gate-soft: #3e2016; --ok: #5fd08a; --ok-soft: #143222; --run: #7ea3ff;
  --st-run: #ffa94d; --st-wait: #ff6b6b; --st-done: #7ea3ff; --st-stop: #c9d1d9; --st-past: #5fd08a;
  --term-bg: #0a0f14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a232d; --ink: #e4eaf0; --muted: #93a1b0; --line: #2a3542;
  --accent: #7ea3ff; --l1: #7ea3ff; --l1-soft: #1c2a47; --l2: #e2aa4f; --l2-soft: #3a2c14;
  --l3: #4cc5a3; --l3-soft: #133a31; --l4: #a3adba; --l4-soft: #262f3a;
  --gate: #ff8a5c; --gate-soft: #3e2016; --ok: #5fd08a; --ok-soft: #143222; --run: #7ea3ff;
  --st-run: #ffa94d; --st-wait: #ff6b6b; --st-done: #7ea3ff; --st-stop: #c9d1d9; --st-past: #5fd08a;
  --term-bg: #0a0f14; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
code, .mono { font-family: var(--mono); font-size: .9em; }
button { font: inherit; color: inherit; cursor: pointer; }
h2, h3 { margin: 0; line-height: 1.3; }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
.top .live { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot.run { background: var(--st-run); animation: pulse 1.4s infinite; }
.dot.run.wait { background: var(--st-wait); }
@keyframes pulse { 50% { opacity: .3; } }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.theme-btn { border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.task-select { display: none; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: var(--ink); }

/* shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 50px); }
aside.tasks { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; }
aside.tasks h3 { font-size: 12px; letter-spacing: .06em; color: var(--muted); padding: 0 8px 8px; }
.filter { display: flex; gap: 4px; padding: 0 6px 10px; flex-wrap: wrap; }
.filter button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
.filter button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.titem { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 4px; }
.titem:hover { background: var(--surface-2); }
.titem[aria-current="true"] { background: var(--l1-soft); border-color: var(--l1); }
.titem .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.titem .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.titem .mini-rail { display: flex; gap: 2px; margin-top: 5px; }
.titem .mini-rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.titem .mini-rail i.done { background: var(--st-past); }
.titem .mini-rail i.cur { background: var(--st-run); }
.titem .mini-rail i.stop { background: var(--st-stop); }
.titem .mini-rail.t-wait i.cur { background: var(--st-wait); }
.titem .mini-rail.t-done i { background: var(--st-done); }
.badge { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.run { color: var(--st-run); border-color: var(--st-run); }
.badge.wait { color: var(--st-wait); border-color: var(--st-wait); background: color-mix(in srgb, var(--st-wait) 14%, transparent); }
.badge.done { color: var(--st-done); border-color: var(--st-done); }
.badge.stop { color: var(--st-stop); border-color: var(--st-stop); }

main { padding: 16px 20px 60px; min-width: 0; }
.task-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 12px; }
.task-head h2 { font-family: var(--mono); font-size: 19px; }
.task-head h2[title], .task-head .info { cursor: help; }
.task-head .info { color: var(--muted); font-size: 14px; }
.task-head .where { font-size: 12px; color: var(--muted); width: 100%; }
nav.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 7px 12px; color: var(--muted); font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
nav.tabs .k { font-family: var(--mono); font-size: 11px; margin-right: 5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.panel > .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.panel > .ph h3 { font-size: 14px; }
.panel > .ph small { color: var(--muted); font-size: 12px; }

/* layouts */
.panels { display: grid; gap: 14px; }
body.lay-a .panel[data-view]:not(.on) { display: none; }
body.lay-b aside.tasks, body.lay-c aside.tasks { display: none; }
body.lay-b .shell, body.lay-c .shell { grid-template-columns: minmax(0, 1fr); }
body.lay-b .task-select, body.lay-c .task-select { display: inline-block; }
body.lay-b nav.tabs, body.lay-c nav.tabs { display: none; }
body.lay-b .panels { grid-template-columns: 1fr 1fr 1.3fr; }
body.lay-b .panel[data-view="status"] { grid-column: 1 / -1; }
body.lay-b .arch-grid { grid-template-columns: 1fr; }
body.lay-b .lv .chips { grid-template-columns: 1fr 1fr; }
body.lay-b .log-wrap { max-height: 520px; overflow: auto; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; } aside.tasks { display: none; } .task-select { display: inline-block; }
  body.lay-b .panels { grid-template-columns: 1fr; }
}

/* status panel */
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.phase { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.phase.done { border-color: var(--ok); }
.phase.cur { border-color: var(--run); box-shadow: 0 0 0 2px var(--l1-soft); }
.phase .pn { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
.steps { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.step { font-size: 12px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.step b { font-family: var(--mono); font-weight: 500; width: 14px; }
.step.done { color: var(--ink); } .step.done::before { content: "✓"; color: var(--ok); width: 10px; }
.step.cur { color: var(--run); font-weight: 600; } .step.cur::before { content: "▶"; width: 10px; font-size: 10px; }
.step.todo::before, .step.skip::before { content: "·"; width: 10px; }
.step.skip { text-decoration: line-through; }
.gate-lamp { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.gate-lamp.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.gate-lamp.wait { border-color: var(--gate); color: var(--gate); background: var(--gate-soft); animation: pulse 1.4s infinite; }
.now { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 760px) { .now { grid-template-columns: 1fr; } .rail { grid-template-columns: 1fr 1fr; } }
.now-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.now-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.detail-col .agent-row, .side .agent-row { grid-template-columns: auto minmax(0, 1fr); } .detail-col .agent-row .tm, .side .agent-row .tm { grid-column: 2; text-align: left; }
.agent-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.agent-row:first-of-type { border-top: 0; }
.agent-row .nm { font-family: var(--mono); font-size: 12.5px; }
.agent-row .sub { color: var(--muted); font-size: 12px; }
.agent-row .tm { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.wait-box { border: 1px solid var(--gate); background: var(--gate-soft); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transform-origin: left; transform: scaleX(var(--p, 0)); transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.bar.live i { background: repeating-linear-gradient(45deg, var(--accent) 0 8px, color-mix(in srgb, var(--accent) 65%, var(--surface)) 8px 16px); background-size: 22px 22px; animation: stripes .7s linear infinite; }
.bar.warn i { background-color: var(--l2); } .bar.bad i { background: var(--gate); }
.bar.ok i { background: var(--ok); }
@keyframes stripes { to { background-position: 22px 0; } }
.fnew { font-weight: 600; background: linear-gradient(90deg, var(--accent), var(--l3), var(--l2), var(--accent)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: grad 3s linear infinite; }
.fnew.typing::after { content: "▍"; color: var(--accent); -webkit-text-fill-color: var(--accent); animation: caret .7s step-end infinite; }
@keyframes grad { to { background-position: -300% 0; } }
@keyframes caret { 50% { opacity: 0; } }
.mock { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; }
.mock h5 { margin: 0 0 6px; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mock pre { margin: 0; background: var(--term-bg); color: var(--term-ink); border-radius: 6px; padding: 8px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
.diff .dl { display: block; padding: 0 6px; border-radius: 3px; }
body.entering .diff .dl, .diff.fresh .dl { animation: rise .35s backwards; animation-delay: calc(var(--i) * 40ms); }
.diff .dl.add { background: color-mix(in srgb, var(--ok) 30%, transparent); }
.diff .dl.del { background: color-mix(in srgb, var(--gate) 30%, transparent); text-decoration: line-through; }
.fsplit { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.fside { position: sticky; top: 64px; } .fside .preview, .fside .mock { margin-top: 0; } .fside .preview { max-height: calc(100vh - 140px); min-height: 220px; }
@media (max-width: 860px) { .fsplit { grid-template-columns: 1fr; } .fside { position: static; } }
.lvcard { display: flex; flex-direction: column; gap: 5px; }
.lvw { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; border-left: 3px solid var(--c); background: var(--soft); border-radius: 5px; padding: 5px 8px; font-size: 12.5px; }
.lvw > b { font-family: var(--mono); color: var(--c); grid-row: span 2; }
.lvw .ln2 { font-size: 11px; color: var(--muted); }
.lvw .items { display: flex; flex-direction: column; gap: 2px; }
.lvw .items code { font-size: 11px; background: var(--surface); }
.lvw .tm2 { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.lvw .none { color: var(--muted); opacity: .7; }
body.entering .lvw, .lvw.fresh { animation: rise .35s backwards; }
.kpis { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi .kl { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.kpi .kv2 { font: 600 18px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .kv2.ok { color: var(--ok); } .kpi .kv2.warn { color: var(--l2); } .kpi .kv2.bad { color: var(--gate); }
.kpi .kv2.st-done { color: var(--st-done); } .kpi .kv2.st-stop { color: var(--st-stop); } .kpi .kv2.st-wait { color: var(--st-wait); }
.kpi .ks { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .bar { margin: 2px 0 0; }
.dash { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 960px) { .dash { grid-template-columns: 1fr; } }
.p2h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 13px; } .p2h small { color: var(--muted); font-size: 11.5px; }
.ltag { font-weight: 600; } .ltag.t1 { color: var(--t1); } .ltag.t2 { color: var(--t2); } .ltag.t3 { color: var(--t3); } .ltag.t4 { color: var(--t4); }
.lvbadge { font: 600 11px var(--mono); padding: 0 6px; border-radius: 4px; color: var(--c); background: var(--soft); border: 1px solid var(--c); white-space: nowrap; }
.sum-box { display: flex; flex-direction: column; gap: 7px; }
.srow { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.srow .sl { color: var(--muted); font-size: 12px; }
.srow .sv { font-family: var(--mono); font-size: 12.5px; text-align: right; } .srow .sv small { color: var(--muted); font-family: var(--sans); }
.srow:last-child { grid-template-columns: 66px minmax(0, 1fr); } .srow:last-child .sv { text-align: left; }
.cells { display: flex; gap: 3px; } .cells i { flex: 1; height: 10px; border-radius: 3px; background: var(--line); }
.cells i.pass { background: var(--ok); animation: pop .5s backwards; } .cells i.fail { background: var(--gate); }
.cells i.run { background: linear-gradient(90deg, var(--line) 25%, var(--l1-soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 2 / -1; }
.pill { font: 11.5px var(--mono); padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.warn { border-color: var(--l2); color: var(--l2); } .pill.bad { border-color: var(--gate); color: var(--surface); background: var(--gate); }
.gauge { display: grid; grid-template-columns: 110px minmax(0, 1fr) 92px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.gauge .gv { font-family: var(--mono); font-size: 12px; text-align: right; }
.gauge .bar { margin: 0; }
.crit { display: flex; gap: 3px; margin-top: 6px; }
.crit span { flex: 1; height: 18px; border-radius: 4px; background: var(--line); display: grid; place-items: center; font: 600 10.5px var(--mono); color: var(--muted); }
.crit span.pass { background: var(--ok); color: var(--surface); animation: pop .5s backwards; }
.crit span.fail { background: var(--gate); color: var(--surface); }
.crit span.run { background: linear-gradient(90deg, var(--line) 25%, var(--l1-soft) 50%, var(--line) 75%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
@keyframes shimmer { to { background-position: -200% 0; } }
/* running step: pulse ring + shimmer */
.vs.cur .no { animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tc, var(--st-run)) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.vs.cur { background: linear-gradient(90deg, var(--surface) 30%, color-mix(in srgb, var(--tc, var(--st-run)) 14%, var(--surface)) 50%, var(--surface) 70%); background-size: 250% 100%; animation: shimmer 2.6s linear infinite; }
.dots3 { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots3 i { width: 5px; height: 5px; border-radius: 50%; background: var(--st-run); animation: bounce 1s ease-in-out infinite; }
.dots3 i:nth-child(2) { animation-delay: .15s; } .dots3 i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
/* entrance */
body.entering .panel.on .now-box, body.entering .panel.on .vs, body.entering .panel.on .vph, body.entering .panel.on .vgate, body.entering .panel.on .lv, body.entering .panel.on .frow { animation: rise .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.num { font-variant-numeric: tabular-nums; }
/* ripple */
button { position: relative; overflow: hidden; }
.rpl { position: absolute; border-radius: 50%; background: color-mix(in srgb, var(--accent) 35%, transparent); transform: scale(0); animation: rpl .6s ease-out forwards; pointer-events: none; }
@keyframes rpl { to { transform: scale(1); opacity: 0; } }
/* timeline */
.tl { position: relative; font-size: 12px; }
.tl-axis { position: relative; height: 18px; margin-left: 170px; border-bottom: 1px solid var(--line); font: 10.5px var(--mono); color: var(--muted); }
.tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); align-items: center; min-height: 26px; border-bottom: 1px dashed var(--line); }
.tl-band { opacity: .7; } .tl-row .tl-mark { opacity: .35; }
.tl-row .lb { font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.tl-row .lb small { color: var(--muted); font-family: var(--sans); }
.tl-track { position: relative; height: 26px; }
.tl-bar { position: absolute; top: 6px; height: 14px; border-radius: 4px; background: var(--c, var(--accent)); transform-origin: left; min-width: 4px; cursor: pointer; transition: width .6s ease; }
body.entering .tl-bar { animation: grow .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }

.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }

.utab th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; border-bottom: 1px solid var(--line); padding: 4px 6px; }

<script>
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '–' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => esc(s).replace(/"/g,'&quot;').replace(/\n/g,'&#10;');
const fmt = s =>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

/* ---------- language: UI labels; in 한국어 mode the overview, criteria and unit titles use the task's Korean copy
   (report-ko.json, `*_ko` fields) where it exists; other text read from task files stays as written ---------- */
let LANG = 'en';
try { if (localStorage.getItem('ma-lang') === 'ko') LANG = 'ko'; } catch (e) {}
const L = (en, ko) => LANG === 'ko' ? ko : en;
const T = (en, ko) => LANG === 'ko' && ko ? ko : en;

/* ---------- theme: auto follows the system; light / dark force it; the choice is kept per browser ---------- */
const THEMES = ['auto', 'light', 'dark'];
let THEME = 'auto';
try { const t = localStorage.getItem('ma-theme'); if (THEMES.includes(t)) THEME = t; } catch (e) {}
const applyTheme = () => { if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME); };
applyTheme();
const fmtMin = m => { m = Math.round(m); return m >= 60 ? L(`${Math.floor(m / 60)}h ${m % 60}m`, `${Math.floor(m / 60)}시간 ${m % 60}분`) : L(m + 'm', m + '분'); };

const PHASES = [
  { n: '① Define', steps: [[1,'Intake'],[2,'Explore → Scope']], gate: 'G1a' },
  { n: '② Plan', steps: [[3,'Plan'],[4,'Plan Review']], gate: 'G1b' },
  { n: '③ Build', steps: [[5,'Execute'],[6,'Merge · Self-check']], gate: 'G2' },
  { n: '④ Accept', steps: [[7,'Verify'],[8,'Review → Deliver']], gate: 'G3' }
];
const STEP_NAME = {1:'Intake',2:'Explore → Scope',3:'Plan',4:'Plan Review → G1b',5:'Execute',6:'Merge · Self-check',7:'Verify',8:'Review → Deliver'};
/* effort fixed in each agent definition (design v0.18, 4.5) */
const EFFORT = { architect:'high', 'plan-reviewer':'high', verifier:'high', reviewer:'high', explorer:'low', researcher:'medium', writer:'medium', coder:'medium' };
const etag = (a, eff) => (eff || EFFORT[a]) ? ` <span class="etag" title="effort">${eff || EFFORT[a]}</span>` : '';
const PROF = { dev: ['dev', '개발'], research: ['research · docs', '조사·문서'], general: ['general', '일반'] };
const prof = t => PROF[t.profile] ? L(...PROF[t.profile]) : '–';

const LEVELS = [
  { id:'L1', cls:'lv1', name:'Orchestration', where:['main session · opus','메인 세션 · opus'], comps:[
    ['router','router','profile · task ID'],['orchestrator','orchestrator','delegate · merge'],['gatekeeper','gatekeeper','popup questions'],['recorder','recorder','run-log · retro']]},
  { id:'L2', cls:'lv2', name:'Design · Judge', where:['subagents','서브에이전트'], comps:[
    ['architect','architect','plan · opus · high'],['plan-reviewer','plan-reviewer','plan verdict · sonnet · high'],['verifier','verifier','criteria verdict · opus · high'],['reviewer','reviewer','quality verdict · sonnet · high']]},
  { id:'L3', cls:'lv3', name:'Workers', where:['subagents','서브에이전트'], comps:[
    ['explorer','explorer','fact finding · sonnet · low'],['researcher','researcher','web research · sonnet · medium'],['writer','writer','drafts · sonnet · medium'],['coder','coder','slice build · sonnet · medium']]},
  { id:'L4', cls:'lv4', name:'Tools · Guards', where:['no LLM judgment','LLM 판단 없음'], comps:[
    ['tools','tools','built-in · MCP'],['hooks','hooks','G1b · scope · log'],['perms','permissions','G2 ask · deny'],['scripts','scripts','run-log · feedback']]}
];
const COMP_DESC = {
  router:['Classifies the request and sets the profile and task ID.','요청을 분류해 프로파일과 작업 ID를 정합니다.'],
  orchestrator:['Hands each phase to L2 and L3 in order and merges the results.','phase 순서대로 L2·L3에 맡기고 결과를 합칩니다.'],
  gatekeeper:['Shows the G1a, G1b, G3 and E popups.','G1a·G1b·G3·E 팝업을 띄웁니다.'],
  recorder:['Writes phase entries, popup answers and the cost (reference) to run-log.','phase 진입, 팝업 결과, 금액(참고)을 run-log에 남깁니다.'],
  architect:['Writes the HOW, the slices, the parallel groups and the mock-up.','HOW, 작업 분할, 병렬 그룹, mock-up을 씁니다.'],
  'plan-reviewer':['Judges the plan independently.','계획을 독립적으로 판정합니다.'],
  verifier:['Gives PASS or FAIL for each completion criterion.','완료 기준마다 PASS/FAIL을 판정합니다.'],
  reviewer:['Judges quality. G3 needs BLOCKER 0.','품질을 판정합니다. BLOCKER 0이어야 G3로 갑니다.'],
  explorer:['Collects where the relevant files are and the facts.','관련 파일 위치와 사실을 모읍니다.'],
  researcher:['Researches one sub-question and writes a note.','하위 질문 하나를 조사해 노트를 씁니다.'],
  writer:['Writes drafts and the prototype.','초안과 prototype을 씁니다.'],
  coder:['Builds one approved slice.','승인된 slice 하나를 구현합니다.'],
  tools:['Built-in tools and MCP tools.','내장 도구와 MCP 도구.'],
  hooks:['plan-approved-check, scope-guard, subagent-log and others.','plan-approved-check, scope-guard, subagent-log 등.'],
  perms:['G2 popup for risky actions such as commits, installs and external sends.','커밋, 설치, 외부 전송 같은 위험한 행동에 G2 팝업.'],
  scripts:['run-log and feedback scripts.','run-log, feedback 스크립트.']
};



/* ---------- tasks: summaries from /api/tasks, full task JSON from /api/tasks/<key> ---------- */
let TASKS = [];
const FULL = {};

const mocksOf = t => t.mocks || [];
/* line diff (LCS) */
function lineDiff(a, b) {
  const A = a.split('\n'), B = b.split('\n'), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
  while (i < n) out.push(['-', A[i++]]); while (j < m) out.push(['+', B[j++]]);
  return out;
}
function mockDiff(t, x, y) {
  const a = mocksOf(t)[x], b = mocksOf(t)[y], d = lineDiff(a.body, b.body);
  const add = d.filter(l => l[0] === '+').length, del = d.filter(l => l[0] === '-').length;
  return `<div class="mock"><h5>Mock-up diff <span class="badge rev">rev${a.r}</span> → <span class="badge rev">rev${b.r}</span>
    <span class="note" style="margin:0"><b style="color:var(--ok)">+${add}</b> <b style="color:var(--gate)">−${del}</b> · ${esc(a.at)} → ${esc(b.at)}</span></h5>
    <pre class="diff">${d.map(([k, l], i) => `<span class="dl ${k === '+' ? 'add' : k === '-' ? 'del' : ''}" style="--i:${i}">${k === ' ' ? ' ' : k} ${esc(l)}</span>`).join('')}</pre></div>`;
}
const mockBlock = (t, m) => `<div class="mock"><h5>Mock-up ${t.revs ? `<span class="badge rev">rev${m.r}</span>` : ''} <span class="badge">${esc(m.kind)}</span>
  <span class="note" style="margin:0">plan.md ## Mock-up · ${esc(m.at)} ${L('approved at G1b', 'G1b 승인')}</span>${m.proto ? ` <span class="badge">+ ${esc(m.proto)}</span>` : ''}</h5><pre>${esc(m.body)}</pre></div>`;

/* ---------- state ---------- */
const st = { task: null, tab: 'status', filter: 'all', comp: 'coder', file: 'plan.md' };
const cur = () => FULL[st.task];
const statusTxt = t => t.status === 'running' ? (t.waiting ? L('Awaiting answer', '답 기다림') : L('Running', '진행 중')) : t.status === 'done' ? L('Done', '완료') : L('Stopped', '중단');
const statusBadge = t => `<span class="badge ${t.status === 'running' ? (t.waiting ? 'wait' : 'run') : t.status === 'done' ? 'done' : 'stop'}">${statusTxt(t)}</span>`;
const taskTone = t => t.status === 'running' ? (t.waiting ? 't-wait' : 't-run') : t.status === 'done' ? 't-done' : 't-stop';
const stepState = (t, n) => t.status === 'done' ? 'done' : n < t.step ? 'done' : n === t.step ? (t.status === 'stopped' ? 'stop' : 'cur') : 'todo';

/* sidebar width and collapsed state are per-viewer conveniences */
try { st.sideMin = localStorage.getItem('ma-side-min') === '1'; const w = +localStorage.getItem('ma-side-w'); if (w) document.documentElement.style.setProperty('--side-w', w + 'px'); } catch (e) {}
/* top bar and sidebar labels */

  if (!tk) return `<section class="rsec"><div class="rsec-h"><h3 class="rlabel">${L('Key takeaway', '핵심 요약')}</h3></div>${NYW('run-log.md')}</section>`;
  let h = '';
  const sc = tk.scope, dv = tk.delivered, nx = tk.next;
  h += sc ? row(sc.pass === sc.criteria, L('Scope', '범위'), L(`${sc.pass} of ${sc.criteria} completion criteria pass.`, `완료 기준 ${sc.criteria}개 중 ${sc.pass}개 통과.`),
    [L(`${sc.units} work units`, `작업 단위 ${sc.units}개`), sc.verify_run != null ? `Verify ${L('run', '회차')} ${sc.verify_run}` : '', sc.plan_rewrites ? L(`${sc.plan_rewrites} plan rewrite`, `계획 재작성 ${sc.plan_rewrites}회`) : ''].filter(Boolean).join(' &middot; '))
    : row(false, L('Scope', '범위'), '-', NYW('scope.md'));
  const dmain = !dv ? '-' : dv.status === 'done' ? (dv.commit ? `${L('Committed as', '커밋')} <code>${rpEsc(dv.commit)}</code>.` : dv.delivered ? rpEsc(dv.delivered) : L('Done.', '완료.'))
    : dv.status === 'aborted' ? L('Aborted.', '중단됨.') : L('Nothing delivered yet.', '아직 전달 없음.') + (dv.step ? ` ${L('step', '단계')} ${rpEsc(dv.step.n)} ${rpEsc(dv.step.name)}` : '');
  h += row(!!dv && dv.status === 'done', L('Delivered', '결과'), dmain, rpReviewSum(d.review_totals));
  h += nx ? row(!(nx.clear || nx.weak), L('Next', '다음'), rpEsc(nx.text), L(`${nx.clear} clear follow-up, ${nx.weak} weak`, `분명한 후속 ${nx.clear}개, 약한 후속 ${nx.weak}개`))
    : row(true, L('Next', '다음'), '-', '');
  return `<section class="rsec"><div class="rsec-h"><h3 class="rlabel">${L('Key takeaway', '핵심 요약')}</h3></div><div class="rcard"><ul class="tk">${h}</ul></div></section>`;
}
function rpParts(d, count) {
  const crit = d.criteria, units = d.units, dec = d.decisions, gr = d.gate_report, tl = d.timeline, cost = tl && tl.cost;
  const hasVerdict = !!crit && crit.some(c => c.verdict), pass = hasVerdict ? crit.filter(c => c.verdict === 'PASS').length : null;
  const done = units ? units.filter(u => u.status === 'done').length : null;
  const paid = cost ? cost.filter(c => c.usd != null) : [], total = paid.reduce((a, c) => a + c.usd, 0), o = d.overview;
  const eyebrow = [o.task, o.profile, o.follows ? L('follows', '이전 작업') + ' ' + o.follows : null, o.status].filter(Boolean).map(rpEsc).join(' &middot; ');
  let h = rpBanner(d, count) + `<p class="reyebrow">${eyebrow}</p>`;
  h += `<section class="rsec" aria-labelledby="h-ov"><div class="rsec-h"><h3 class="rlabel" id="h-ov">${L('Overview', '개요')}</h3><span class="seg small" role="group" aria-label="Overview form"><button data-rov="para" aria-pressed="${rp.ov === 'para'}">${L('Paragraph', '문단')}</button><button data-rov="list" aria-pressed="${rp.ov === 'list'}">${L('List', '목록')}</button></span></div><div class="rcard" id="ov-body">${rpOverview(d)}</div></section>`;
  h += rpTakeaway(d);
  let cb;
  if (crit) {
    cb = '<div class="rows">' + crit.map((c, i) => { const title = T(c.title, c.title_ko);
      return rpRow('rc-' + c.n, i, rpEsc(c.n), c.verdict === 'PASS' ? 'pass' : c.verdict === 'FAIL' ? 'fail' : '', rpEsc(T(c.short, c.short_ko) || title), title, rpEsc(c.verdict || '-'),
        `<p><b>${rpEsc(title)}.</b> ${rpEsc(c.evidence)}</p>`); }).join('') + '</div>' + (hasVerdict ? '' : NYW('verify.md'));
  } else cb = NYW('scope.md');
  let ub;
  if (units) {
    const fl = a => '<ul class="files">' + a.map(f => `<li><code>${rpEsc(f)}</code></li>`).join('') + '</ul>';
    ub = '<div class="rows">' + units.map((u, i) => {
      const files = u.files || [], tests = files.filter(f => /(^|\/)tests\//.test(f)), other = files.filter(f => tests.indexOf(f) < 0);
      const title = T(u.title, u.title_ko);
      return rpRow('ru-' + u.id, i, rpEsc(u.id), u.status === 'done' ? 'pass' : 'run', rpEsc(title), title, `<span class="stt${u.status === 'done' ? '' : ' other'}">${rpEsc(u.status)}</span>`,
        `<p>${u.group ? L('Group ', '그룹 ') + rpEsc(u.group) : ''}${u.secs ? L(', ran ', ', 실행 ') + rpDur(u.secs) : ''}.</p><div class="gh">${L('FILES', '파일')} (${other.length})</div>${fl(other)}<div class="gh">${L('TESTS', '테스트')} (${tests.length})</div>${fl(tests)}<div class="gh">${L('CRITERIA', '기준')}</div><p>${(u.criteria || []).map(n => `<span class="rpill">${rpEsc(n)}</span>`).join('')}</p>`);
    }).join('') + '</div>';
  } else ub = NYW('plan.md');
  const groups = units ? new Set(units.map(u => u.group).filter(Boolean)).size : 0;
  const steps = tl && tl.steps && tl.steps.length ? tl.steps : null, rewrites = tl ? (tl.backs || []).filter(b => b.to === 3).length : 0;
  const tsum = steps ? [rpHm(new Date(steps[0].start)) + ' &rarr; ' + rpHm(new Date(tl.end || Date.now())), rpDur((new Date(tl.end || Date.now()) - new Date(steps[0].start)) / 1000), rewrites ? L(`${rewrites} plan rewrite`, `계획 재작성 ${rewrites}회`) : ''].filter(Boolean).join(' &middot; ') : '-';
  const fu = gr ? '<ul class="fl">' + (gr.improvements || []).map(s => `<li><span class="tag ${s.strength === 'clear' ? 'clear' : ''}">${rpEsc(s.level)} ${rpEsc(s.strength)}</span><span class="one" title="${rpEsc(s.text)}">${rpEsc(s.text)}</span></li>`).join('') + '</ul>' : NYW('gate-report.md');
  const msum = [dec ? L(`${dec.length} decisions`, `결정 ${dec.length}건`) : '', rpReviewSum(d.review_totals), paid.length ? '$' + total.toFixed(2) : ''].filter(Boolean).join(' &middot; ');
  h += '<div class="group">' +
    rpDisc('rd-crit', L('Completion criteria', '완료 기준'), crit ? (hasVerdict ? `${pass} / ${crit.length} PASS` : `${crit.length}`) : '-', cb) +
    rpDisc('rd-units', L('Work units', '작업 단위'), units ? `${done} / ${units.length} ${L('done', '완료')} &middot; ${L(`${groups} groups`, `그룹 ${groups}개`)}` : '-', ub) +
    rpDisc('rd-tl', L('Phase timeline', '단계 타임라인'), tsum, tl ? rpTimeline(tl) : NYW('run-log.md')) +
    rpDisc('rd-fu', L('Follow-up', '후속 작업'), gr ? L(`${(gr.improvements || []).length} suggestions from the gate report`, `게이트 보고서의 제안 ${(gr.improvements || []).length}건`) : '-', fu) +
    rpDisc('rd-more', L('Decisions · review · cost', '결정 · 리뷰 · 비용'), msum || '-', rpMore(d)) + '</div>';
  return h;
}
function renderReport() {
  if (st.tab !== 'report') return;
  const el = $('p-report'), d = RP[st.task];
  if (!d) { el.innerHTML = `<p class="note">${L('Loading…', '불러오는 중…')}</p>`; return; }
  if (d.error) { el.innerHTML = `<p class="nyw">${L('The report could not be read', '리포트를 읽을 수 없음')}: ${rpEsc(d.error)}</p>`; return; }
  const play = rp.play && !rpReduce(); rp.play = false;   /* the entry motion runs on tab entry or task change, not on a poll */
  const first = !rp.counted.has(st.task), count = first && !rpReduce();   /* the banner numbers count up once per task */
  if (!rp.seeded.has(st.task)) { rp.seeded.add(st.task); rp.open.add(st.task + '|rd-tl'); }   /* only the timeline row starts open, once; later polls keep the person's choice */
  el.classList.toggle('rp-enter', play);
  el.innerHTML = rpParts(d, count);
  thinAxis(el);
  if (first && (!count || el.querySelector('[data-count]'))) rp.counted.add(st.task);
  clearTimeout(rpT);
  if (count) rpCount();
  if (play) rpT = setTimeout(() => el.classList.remove('rp-enter'), 1800);
}
function rpCount() {
  document.querySelectorAll('#p-report [data-count]').forEach(el => {
    const to = parseFloat(el.dataset.count), dec = parseInt(el.dataset.dec, 10) || 0; let t0 = null;
    const tick = ts => { if (t0 == null) t0 = ts; const p = Math.min(1, (ts - t0) / 500);
      el.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(dec); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function rpToggle(b) {
  const s = b.closest('.sec'); if (!s) return;
  const open = !s.classList.contains('open'), k = st.task + '|' + b.dataset.rx;
  s.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
  if (open) rp.open.add(k); else rp.open.delete(k);
}
function rpOverviewForm(b) {
  rp.ov = b.dataset.rov;
  document.querySelectorAll('#p-report [data-rov]').forEach(x => x.setAttribute('aria-pressed', x === b));
  const d = RP[st.task]; if (d && d.overview) $('ov-body').innerHTML = rpOverview(d);
}
/* ---------- end report tab ---------- */

/* ---------- live data: poll the local server every 2 s ---------- */
const POLL_MS = 2000;
let lastSig = '';
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); }
async function loadTask(key) {
  const t = await getJSON('/api/tasks/' + encodeURIComponent(key).replace(/%2F/g, '/'));
  const old = FULL[key];
  if (old && old.log && t.log) {   /* follow the newest record only if replay was already at the end */
    const seen = new Set(old.log.map(e => e.ts + e.k + e.tx));
    t.log.forEach(e => { e.isNew = !seen.has(e.ts + e.k + e.tx); });
    if (key === st.task && !st.playing && st.ri === old.log.length - 1 && t.log.length > old.log.length) st.ri = t.log.length - 1;
  }
  FULL[key] = t;
  return t;
}
async function poll() {
  try {
    const data = await getJSON('/api/tasks');
    TASKS = data.tasks;
    if (!TASKS.some(t => t.key === st.task)) st.task = (TASKS.find(t => t.status === 'running') || TASKS[0] || {}).key || null;
    if (st.task) await loadTask(st.task);
    if (st.task && st.tab === 'report') await loadReport(st.task);
    st.offline = false;
  } catch (err) { st.offline = true; }
  st.liveWait = TASKS.some(t => t.status === 'running' && t.waiting);
  const sig = JSON.stringify([TASKS, st.task && FULL[st.task], st.offline, st.task && RP[st.task]]);
  if (sig !== lastSig) { const first = !lastSig; lastSig = sig; if (first) entering(); renderAll(); if (first) setTimeout(() => scramble(document.querySelector('#task-head h2')), 30); }
}
async function selectTask(key) {
  st.task = key; st.ri = 0; st.rev = null;
  if (!FULL[key]) { try { await loadTask(key); } catch (err) { st.offline = true; } }
  if (st.tab === 'report') { rp.play = true; await loadReport(key); }
  lastSig = JSON.stringify([TASKS, FULL[key], st.offline, RP[key]]);
  entering(); vt(() => renderAll()); setTimeout(() => scramble(document.querySelector('#task-head h2')), 30);
}
/* #task=<key>&tab=report: monitor-up.py --task, the tray and open-html.py --report open the page on that task and tab */
function applyHash(initial) {
  const q = new URLSearchParams(location.hash.replace(/^#/, '')), task = q.get('task'), tab = q.get('tab');
  if (tab === 'report') { st.tab = 'report'; rp.play = true; }
  if (initial) { if (task) st.task = task; return; }
  if (task && task !== st.task) selectTask(task);
  else if (tab === 'report') { entering(); rpEnterTab(); vt(() => renderAll()); }
}
applyHash(true);
window.addEventListener('hashchange', () => applyHash(false));
poll(); setInterval(poll, POLL_MS);
</script>
