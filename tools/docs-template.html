<style>
:root {
  --bg: #eef1f4; --surface: #fff; --surface-2: #f6f8fa; --ink: #17202a; --muted: #5a6674; --line: #d3dae2;

  --l3: #4cc5a3; --l3-soft: #133a31; --l4: #a3adba; --l4-soft: #262f3a;

  --code-bg: #0a0f14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a232d; --ink: #e4eaf0; --muted: #93a1b0; --line: #2a3542;
  --accent: #7ea3ff; --l1: #7ea3ff; --l1-soft: #1c2a47; --l2: #e2aa4f; --l2-soft: #3a2c14;
  --l3: #4cc5a3; --l3-soft: #133a31; --l4: #a3adba; --l4-soft: #262f3a;
  --gate: #ff8a5c; --gate-soft: #3e2016; --ok: #5fd08a; --ok-soft: #143222; --no: #ff7b72; --no-soft: #3d1a18;
  --code-bg: #0a0f14; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0; }
.l1 { --c: var(--l1); --soft: var(--l1-soft); } .l2 { --c: var(--l2); --soft: var(--l2-soft); }
.l3 { --c: var(--l3); --soft: var(--l3-soft); } .l4 { --c: var(--l4); --soft: var(--l4-soft); }

/* top bar */
header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }

.spacer { flex: 1; }
.theme { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 2px 9px; font-size: 12px; color: var(--muted); }

nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 80px; }
.lede { color: var(--muted); max-width: 760px; margin: 4px 0 18px; }
h1.page { font-size: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel + .panel, .stack > * + * { margin-top: 14px; }
.panel > h2 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel > h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-family: var(--mono); }
.badge.lv { color: var(--c); border-color: var(--c); background: var(--soft); font-weight: 600; }
.badge.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.badge.no { color: var(--no); border-color: var(--no); background: var(--no-soft); }
.badge.gate { color: var(--gate); border-color: var(--gate); background: var(--gate-soft); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 1px 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.chip.off { color: var(--muted); opacity: .45; text-decoration: line-through; }
a.chip:hover { border-color: var(--accent); text-decoration: none; }

/* rendered markdown */
.md { overflow-wrap: break-word; }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 2px 0; }
.md h4, .md h5, .md h6 { margin: 12px 0 4px; font-size: 13.5px; }
.md pre.code, pre.code { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 12.5px/1.55 var(--mono); margin: 8px 0; }
pre.code code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
.tbl { overflow-x: auto; margin: 8px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 6px 9px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
details.src { border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; background: var(--surface); }
details.src > summary { cursor: pointer; padding: 8px 12px; font-weight: 600; font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.src > summary::-webkit-details-marker { display: none; }
details.src > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
details.src[open] > summary::before { transform: rotate(90deg); }
details.src > summary .from { margin-left: auto; font: 400 11px var(--mono); color: var(--muted); text-align: right; }
details.src > .md { padding: 0 14px 10px; border-top: 1px solid var(--line); }

/* overview */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi b { font: 600 26px/1.1 var(--mono); display: block; }
.kpi span { color: var(--muted); font-size: 12.5px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.person { text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 6px; margin-bottom: 8px; }
.lvbox { border-left: 4px solid var(--c); background: var(--soft); border-radius: 7px; padding: 9px 11px; margin-bottom: 8px; }
.lvbox .lh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 7px; font-size: 13px; }
.lvbox .lh b { color: var(--c); font-family: var(--mono); }
.lvbox .lh a { color: var(--ink); font-weight: 600; }
.lvbox .lh span { color: var(--muted); font-size: 12px; }
.comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.comp { display: block; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); background: var(--surface); border-radius: 6px; padding: 5px 8px; color: var(--ink); min-width: 0; }
.comp:hover { border-color: var(--c); text-decoration: none; }
.comp b { font: 600 12.5px var(--mono); display: block; overflow-wrap: anywhere; }
.comp small { color: var(--muted); font-size: 11.5px; display: block; line-height: 1.35; }
.arrow-note { font-size: 12px; color: var(--muted); margin: -2px 0 8px 12px; }
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ph { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); position: relative; }
.ph .pn { font-weight: 600; font-size: 13px; }
.ph a.st { display: flex; gap: 6px; font-size: 12.5px; color: var(--ink); padding: 1px 0; }
.ph a.st b { font-family: var(--mono); font-weight: 500; color: var(--muted); width: 12px; }
.ph .gend { margin-top: 6px; }

/* two-pane layouts */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.split > * { min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { position: sticky; top: 100px; max-height: calc(100vh - 120px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; }
.side h3 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 4px; }
.side a { display: flex; justify-content: space-between; gap: 6px; align-items: center; padding: 4px 9px; border-radius: 6px; color: var(--ink); font-size: 13px; border-left: 3px solid transparent; }
.side a:hover { background: var(--surface-2); text-decoration: none; }
.side a[aria-current="true"] { background: var(--soft, var(--l1-soft)); border-left-color: var(--c, var(--accent)); font-weight: 600; }
.side a.lvl { font-weight: 600; margin-top: 4px; }
.side a.sub { padding-left: 18px; font-family: var(--mono); font-size: 12.5px; }
.side a .tag { font: 400 11px var(--mono); color: var(--muted); }
.side select { display: none; }
.side .tree { font-family: var(--mono); font-size: 12.5px; }
.side .tree a { padding-left: 14px; font-family: var(--mono); }
.side .tree .root { color: var(--muted); padding: 4px 9px; font-size: 12px; }

.dhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 4px; }
.dhead h1 { font: 600 21px var(--mono); }
.desc { color: var(--muted); margin: 2px 0 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 4px; }
.fact { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface-2); }
.fact span { display: block; font-size: 11.5px; color: var(--muted); }
.fact b { font: 600 13.5px var(--mono); }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); }
.kv > div { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.kv > div:nth-child(odd) { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.scope-row td:first-child { width: 150px; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { display: block; border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 8px; padding: 10px 12px; background: var(--surface); color: var(--ink); }
.card:hover { text-decoration: none; border-color: var(--c); }
.card b { font: 600 13.5px var(--mono); }
.card p { margin: 4px 0 6px; font-size: 12.5px; color: var(--muted); }
.matrix td, .matrix th { text-align: center; font-family: var(--mono); font-size: 12px; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--ok); font-weight: 700; } .nope { color: var(--line); }

/* flow */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.phase-block { margin-top: 18px; }
.phase-block > h2 { font-size: 16px; margin-bottom: 8px; }
.step { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 9px; padding: 12px 14px; margin-bottom: 10px; scroll-margin-top: 110px; }
.step.hl { box-shadow: 0 0 0 2px var(--c); }
.step .sh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.step .sh .n { font: 600 13px var(--mono); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--c); color: var(--surface); }
.step .sh h3 { font-size: 15px; }
.step .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; margin-top: 8px; font-size: 13.5px; }
.step .row > span { color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 2px; }
.gatebar { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px 8px; padding: 8px 12px; border: 1px dashed var(--gate); border-radius: 8px; background: var(--gate-soft); font-size: 13px; }
.gatebar b { font-family: var(--mono); color: var(--gate); }
.flowtext { white-space: pre; }

@media (max-width: 960px) {
  .ov-grid, .two { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; padding: 8px; }
  .side .list { display: none; }
  .side select { display: block; width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); color: var(--ink); }
}
@media (max-width: 640px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .rail { grid-template-columns: 1fr 1fr; }
  .kv { grid-template-columns: 1fr; } .kv > div:nth-child(odd) { border-bottom: 0; padding-bottom: 0; }
  .step .row { grid-template-columns: 1fr; }
  .panel { padding: 14px; }
}
</style>

<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#overview" style="color:var(--ink)"><span class="bars"><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i></span>my-agent architecture</a>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <button class="theme" id="theme" type="button" aria-label="Switch color theme">Theme: auto</button>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-v="overview"><span class="k">1</span>Overview</a>
      <a href="#levels" data-v="levels"><span class="k">2</span>Levels &amp; roles</a>
      <a href="#flow" data-v="flow"><span class="k">3</span>Steps &amp; gates</a>
      <a href="#artifacts" data-v="artifacts"><span class="k">4</span>Deliverables &amp; formats</a>
      <a href="#vocab" data-v="vocab"><span class="k">5</span>Shared words</a>
    </nav>
  </div>
</header>
<main id="main"></main>
<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lvClass = id => 'l' + String(id).replace(/\D/g, '');
const agentById = Object.fromEntries(D.agents.map(a => [a.id, a]));
const levelOf = Object.fromEntries(D.levels.flatMap(l => l.comps.map(c => [c.id, l])));
const PROFILES = ['general', 'research', 'dev'];
let profile = 'general';
try { profile = localStorage.getItem('ma-profile') || 'general'; } catch (e) {}

const TICKS = /\x60([^\x60]+)\x60/g;
function src(s, open) {
  return `<details class="src"${open ? ' open' : ''}><summary><span>${esc(s.title).replace(TICKS, '<code>$1</code>')}</span><span class="from">${esc(s.from || '')}</span></summary><div class="md">${s.html}</div></details>`;
}
function sec(title, html, open, from) { return src({ title, html, from }, open); }
function compLink(c, l) {
  return `<a class="comp" href="#levels/${c.id}"><b>${esc(c.name)}</b><small>${esc(c.sub || summary(c.id) || '')}</small></a>`;
}
function levelNote(l) {
  const paren = l.title.match(/\(([^)]*)\)\s*$/);
  return /main session/.test(l.title) ? l.title.split(' · ').slice(1).join(' · ') : paren ? paren[1] : '';
}
const plain = h => h.replace(/\s*\(<strong>[^<]*<\/strong>\)|\s*<strong>\([^<]*\)<\/strong>/g, '');
function summary(id) {
  const a = agentById[id];
  return a ? `${a.model} · ${a.effort}` : '';
}
function stepName(n) {
  if (n === 'R') return 'Retrospective';
  if (n === 'G1b') return 'G1b approval';
  const s = D.steps.find(x => x.n === n);
  return s ? `${n}. ${s.name.replace(/<[^>]+>/g, '')}` : n;
}
function stepChip(n) {
  const href = /^\d$|^R$/.test(n) ? `#flow/${n}` : `#flow/gates`;
  return `<a class="chip" href="${href}">${esc(stepName(n))}</a>`;
}
function artChip(a) { return `<a class="chip" href="#artifacts/${encodeURIComponent(a.id)}">${esc(a.id)}</a>`; }
function writes(agentId) { return D.artifacts.filter(a => a.writer.includes('my-agent:' + agentId)); }

/* ---------- overview ---------- */
function viewOverview() {
  const gates = D.gates.length, steps = D.steps.length;
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1a', '4': 'G1b', '8': 'G3' };
  return `<h1 class="page">How my-agent is put together</h1>
  <p class="lede">${esc(D.description)}. Every value on this page is read from the plugin files of version ${esc(D.version)} (design ${esc(D.design)}) by <code>tools/build-docs.py</code>.</p>
  <div class="kpis">
    <a class="kpi" href="#levels" style="color:inherit;text-decoration:none"><b>${D.levels.length}</b><span>levels</span></a>
    <a class="kpi" href="#levels/L2" style="color:inherit;text-decoration:none"><b>${D.agents.length}</b><span>subagents (L2 ${D.agents.filter(a => a.level === 'L2').length} · L3 ${D.agents.filter(a => a.level === 'L3').length})</span></a>
    <a class="kpi" href="#flow" style="color:inherit;text-decoration:none"><b>${phases.length} · ${steps}</b><span>phases · steps</span></a>
    <a class="kpi" href="#flow/gates" style="color:inherit;text-decoration:none"><b>${gates}</b><span>human gates (${D.gates.map(g => g.id).join(' · ')})</span></a>
  </div>
  <div class="ov-grid">
    <section class="panel"><h2>Four levels <small>select a component for its role and permissions</small></h2>
      <div class="person">The person (user · maintainer) ⇄ L1 Gatekeeper: every question as a choice popup</div>
      ${D.levels.map((l, i) => `<div class="lvbox ${lvClass(l.id)}">
        <div class="lh"><b>${l.id}</b><a href="#levels/${l.id}">${esc(l.name)}</a><span>${esc(levelNote(l))}</span></div>
        <div class="comps">${l.comps.map(c => compLink(c, l)).join('')}</div></div>
        ${i === 0 ? '<div class="arrow-note">↓ L1 delegates to L2 and to L3 directly — paths and criteria only; L2 never manages L3</div>' : ''}
        ${i === 2 ? '<div class="arrow-note">↓ L2 and L3 call L4; L4 shows G2 permission requests to the person</div>' : ''}`).join('')}
    </section>
    <div class="stack">
      <section class="panel"><h2>Four phases, eight steps <small>gates close each phase</small></h2>
        <div class="rail">${phases.map(p => `<div class="ph"><div class="pn">${esc(p)}</div>
          ${D.steps.filter(s => s.phase === p).map(s => `<a class="st" href="#flow/${s.n}"><b>${s.n}</b><span>${plain(s.name)}</span></a>`).join('')}
          <div class="gend">${D.steps.filter(s => s.phase === p && gateAfter[s.n]).map(s => `<a class="badge gate" href="#flow/gates">${gateAfter[s.n]}</a>`).join('')}</div></div>`).join('')}</div>
        <p class="muted" style="font-size:12.5px;margin:10px 0 0">G2 (risky action) can appear during any step; E (escalation) hands control to the person when failures repeat.</p>
      </section>
      <section class="panel"><h2>Principles</h2><div class="md">${D.principles}</div></section>
    </div>
  </div>
  <section class="panel"><h2>Delegation paths</h2><div class="md">${D.delegation}</div></section>`;
}

/* ---------- levels ---------- */
function levelsSide(cur) {
  const items = D.levels.map(l => `<a class="lvl ${lvClass(l.id)}" href="#levels/${l.id}" aria-current="${cur === l.id}">${l.id} · ${esc(l.name)}</a>`
    + l.comps.map(c => `<a class="sub ${lvClass(l.id)}" href="#levels/${c.id}" aria-current="${cur === c.id}">${esc(c.name)}${agentById[c.id] ? `<span class="tag">${agentById[c.id].model}</span>` : ''}</a>`).join('')).join('');
  const opts = D.levels.map(l => `<option value="${l.id}"${cur === l.id ? ' selected' : ''}>${l.id} · ${esc(l.name)}</option>`
    + l.comps.map(c => `<option value="${c.id}"${cur === c.id ? ' selected' : ''}>&nbsp;&nbsp;${esc(c.name)}</option>`).join('')).join('');
  return `<aside class="side"><div class="list"><h3>Levels and components</h3>${items}</div>
    <select onchange="location.hash='levels/'+this.value" aria-label="Level or component">${opts}</select></aside>`;
}
function viewLevels(id) {
  id = id || 'L1';
  const lv = D.levels.find(l => l.id === id);
  let body;
  if (lv) body = levelDetail(lv);
  else if (agentById[id]) body = agentDetail(agentById[id]);
  else if (levelOf[id]?.id === 'L1') body = l1Detail(levelOf[id].comps.find(c => c.id === id));
  else if (levelOf[id]?.id === 'L4') body = l4Detail(levelOf[id].comps.find(c => c.id === id));
  else body = `<p>Unknown component <code>${esc(id)}</code>.</p>`;
  return `<div class="split">${levelsSide(id)}<div class="${lvClass((lv || levelOf[id] || {}).id || 'L1')}">${body}</div></div>`;
}
function levelDetail(lv) {
  const cards = lv.comps.map(c => {
    const a = agentById[c.id];
    const tail = a ? `<div class="chips">${a.tools.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
    return `<a class="card ${lvClass(lv.id)}" href="#levels/${c.id}"><b>${esc(c.name)}</b><p>${esc(a ? a.description.replace(/^my-agent L\d [^.]*\.\s*/, '') : c.sub)}</p>${a ? `<p class="mono">${a.model} · effort ${a.effort}${a.maxTurns ? ' · maxTurns ' + a.maxTurns : ''}</p>` : ''}${tail}</a>`;
  }).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">${lv.id}</span><h1>${esc(lv.name)}</h1></div>
    <p class="desc">${esc(lv.title)}</p>
    <div class="kv"><div>Runs in</div><div>${lv.runsIn}</div><div>Information it sees</div><div>${lv.sees}</div>
      <div>Output</div><div>${lv.output}</div><div>What it cannot do</div><div>${lv.cannot}</div></div></div>
    <div class="panel"><h2>Components <small>${lv.comps.length}</small></h2><div class="cards">${cards}</div></div>
    ${lv.id === 'L2' || lv.id === 'L3' ? `<div class="panel"><h2>Read and write scope <small>scope-guard.py, every my-agent:* call</small></h2><div class="md">${D.scopeDoc}</div>${scopeMatrix(D.agents.filter(a => a.level === lv.id))}</div>` : ''}
    ${lv.id === 'L1' ? `<div class="panel"><h2>Level table in SKILL.md</h2><div class="md">${D.skillLevels}</div></div>` : ''}
    ${lv.id === 'L4' ? `<div class="panel"><h2>About the levels</h2><div class="md">${D.levelNotes}</div></div>` : ''}`;
}
function scopeList(xs) { return xs.length ? xs.map(x => `<code>${esc(x)}</code>`).join(' ') : '<span class="muted">nothing</span>'; }
function scopeMatrix(list) {
  return `<div class="tbl"><table><thead><tr><th>Agent</th><th>Reads</th><th>Writes</th><th>Bash writes</th><th>Web</th><th>Before G1b</th></tr></thead><tbody>
    ${list.map(a => `<tr><td><a class="mono" href="#levels/${a.id}">${a.id}</a></td><td>${scopeList(a.scope.read)}</td><td>${scopeList(a.scope.write)}${a.scope.denyWrite.length ? `<br><span class="muted">never: </span>${scopeList(a.scope.denyWrite)}` : ''}</td>
      <td>${a.scope.bashWrites ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td><td>${a.scope.web ? '<span class="badge ok">yes</span>' : '<span class="badge no">no</span>'}</td>
      <td>${a.beforeApproval ? '<span class="badge ok">allowed</span>' : '<span class="badge">after approval</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}
function agentDetail(a) {
  const allTools = D.l4.tools;
  const used = PROFILES.map(p => {
    const u = D.profiles[p].used[a.id];
    return `<tr><td class="mono">${p}</td><td>${u ? u[0] : '<span class="muted">not used</span>'}</td><td>${u ? u[1] : ''}</td></tr>`;
  }).join('');
  const ws = writes(a.id);
  const fmt = a.sections.filter(s => /format|sections/i.test(s.title));
  const rest = a.sections.filter(s => !fmt.includes(s));
  return `<div class="panel"><div class="dhead"><span class="badge lv">${a.level}</span><h1>${esc(a.call)}</h1></div>
    <p class="desc">${esc(a.description)}</p>
    <div class="md">${a.role}</div>
    <div class="facts"><div class="fact"><span>Model</span><b>${esc(a.model)}</b></div><div class="fact"><span>Effort</span><b>${esc(a.effort)}</b></div>
      <div class="fact"><span>maxTurns</span><b>${esc(a.maxTurns || '—')}</b></div>
      <div class="fact"><span>Before G1b approval</span><b>${a.beforeApproval ? 'allowed' : 'blocked'}</b></div>
      <div class="fact"><span>Runs plan work units</span><b>${a.unitAgent ? 'yes (unit=u&lt;n&gt;)' : 'no'}</b></div></div>
    <p class="muted mono" style="font-size:11.5px;margin:8px 0 0">${esc(a.file)}</p></div>
  <div class="panel"><h2>Permissions <small>tools from the definition frontmatter; paths enforced by scope-guard.py</small></h2>
    <div class="chips" style="margin-bottom:10px">${allTools.map(t => `<span class="chip ${a.tools.includes(t) ? '' : 'off'}">${esc(t)}</span>`).join('')}<span class="chip off">Agent</span></div>
    <div class="tbl"><table><tbody>
      <tr class="scope-row"><td>Reads</td><td>${scopeList(a.scope.read)}</td></tr>
      <tr class="scope-row"><td>Writes</td><td>${scopeList(a.scope.write)}</td></tr>
      ${a.scope.denyWrite.length ? `<tr class="scope-row"><td>Never writes</td><td>${scopeList(a.scope.denyWrite)}</td></tr>` : ''}
      <tr class="scope-row"><td>Bash that writes</td><td>${a.scope.bashWrites ? 'allowed' : 'blocked (read and check commands only)'}</td></tr>
      <tr class="scope-row"><td>Web</td><td>${a.scope.web ? 'allowed' : 'blocked'}</td></tr>
      <tr class="scope-row"><td>Secret files</td><td>blocked for every agent — <code>deny</code> rules: ${D.l4.deny.filter(x => x.startsWith('Read(')).map(x => `<code>${esc(x)}</code>`).join(' ')}</td></tr>
      <tr class="scope-row"><td>Delegate further</td><td>no — the <code>Agent</code> tool is left out of every definition</td></tr>
    </tbody></table></div></div>
  <div class="panel"><h2>Where it is used <small>"Agents used" in each profile file</small></h2>
    <div class="tbl"><table><thead><tr><th>Profile</th><th>Steps</th><th>Result</th></tr></thead><tbody>${used}</tbody></table></div>
    ${ws.length ? `<p style="margin:8px 0 0"><span class="muted">Deliverables: </span>${ws.map(artChip).join(' ')}</p>` : ''}</div>
  <div class="panel"><h2>Definition <small>sections of the agent file</small></h2>
    ${fmt.map(s => sec(s.title, s.html, true, 'output format')).join('')}
    ${rest.map(s => sec(s.title, s.html, s.title === 'Rules' || s.title === 'Input' || s.title === 'When done')).join('')}</div>`;
}
function l1Detail(c) {
  const d = D.l1[c.id] || { leads: [], sources: [] };
  const steps = d.leads.map(n => D.steps.find(s => s.n === n));
  return `<div class="panel"><div class="dhead"><span class="badge lv">L1</span><h1>${esc(c.name)}</h1></div>
    <p class="desc">${esc(c.sub)} · runs inside the main session as part of the my-agent skill</p>
    ${steps.length ? `<p><span class="muted">Leads steps: </span>${steps.map(s => stepChip(s.n)).join(' ')}</p>` : ''}
    <p class="muted" style="font-size:12.5px"><span class="muted">Does not: </span>${D.l1DoesNot}</p></div>
    <div class="panel"><h2>Rules</h2>${d.sources.map(s => src(s, true)).join('')}
    ${steps.map(s => s.rules.map(r => src({ ...r, title: `Step ${s.n} · ${r.title}` }, false)).join('')).join('')}</div>`;
}
function l4Detail(c) {
  const L = D.l4;
  if (c.id === 'hooks') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>hooks</h1></div><p class="desc">${esc(c.sub)}</p>
      <div class="tbl"><table><thead><tr><th>Event</th><th>Matcher</th><th>Script</th><th>Where</th><th>On failure</th><th>What it does</th></tr></thead><tbody>
      ${L.hooks.map(h => `<tr><td class="mono">${esc(h.event)}</td><td><code>${esc(h.matcher)}</code></td><td class="mono">${esc(h.script)} ${esc(h.arg)}</td><td>${esc(h.where)}</td><td>${h.onFailure === 'block' ? '<span class="badge no">block</span>' : '<span class="badge">exit 0</span>'}</td><td>${esc(h.doc)}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><h2>G1b hard gate</h2><div class="md">${L.hardGate}</div></div>`;
  }
  if (c.id === 'permission-rules') {
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>permission rules</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/permissions/permissions.json</code>, merged by hand into <code>~/.claude/settings.json</code></p>
      <div class="two"><div><h3 style="font-size:13px;margin-bottom:6px">ask <span class="badge gate">G2</span></h3><div class="chips">${L.ask.map(x => `<code>${esc(x)}</code>`).join('')}</div></div>
      <div><h3 style="font-size:13px;margin-bottom:6px">deny</h3><div class="chips">${L.deny.map(x => `<code>${esc(x)}</code>`).join('')}</div></div></div></div>
      <div class="panel"><h2>What G2 asks about</h2><div class="md">${L.g2}</div></div>`;
  }
  if (c.id === 'scripts') {
    const list = xs => `<div class="tbl"><table><tbody>${xs.map(s => `<tr><td class="mono" style="white-space:nowrap">${esc(s.name)}</td><td>${esc(s.doc)}</td></tr>`).join('')}</tbody></table></div>`;
    return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>scripts</h1></div><p class="desc">${esc(c.sub)} · <code>l4-tools-guards/scripts/</code></p>${list(L.scripts)}</div>
      <div class="panel"><h2>Shared library <small>l4-tools-guards/lib/ — used by hooks, scripts and the monitor</small></h2>${list(L.lib)}</div>`;
  }
  const head = `<tr><th>Agent</th>${L.tools.map(t => `<th>${esc(t)}</th>`).join('')}<th>Agent</th></tr>`;
  const rows = D.agents.map(a => `<tr><td><a href="#levels/${a.id}">${a.call}</a></td>${L.tools.map(t => a.tools.includes(t) ? '<td class="yes">●</td>' : '<td class="nope">·</td>').join('')}<td class="nope">·</td></tr>`).join('');
  return `<div class="panel"><div class="dhead"><span class="badge lv">L4</span><h1>${esc(c.name)}</h1></div><p class="desc">Built-in tools and MCP servers run what the agents ask for. Which tools each subagent may call is fixed in its definition frontmatter (<code>tools:</code>); no definition has <code>Agent</code>, so no subagent can delegate.</p>
    <div class="tbl"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div>
    <div class="panel"><h2>What limits the tools</h2><div class="md">${D.scopeDoc}</div></div>`;
}

/* ---------- flow ---------- */
function viewFlow(sub) {
  const P = D.profiles[profile];
  const phases = [...new Set(D.steps.map(s => s.phase))];
  const gateAfter = { '2': 'G1a', '4': 'G1b', '8': 'G3' };
  const gateById = Object.fromEntries(D.gates.map(g => [g.id, g]));
  const agentsIn = n => Object.entries(P.used).filter(([, u]) => new RegExp(`(^|[^0-9])${n}([^0-9]|$)`).test(u[0].replace(/<[^>]+>/g, ''))).map(([id]) => id);
  const stepCard = s => {
    const lvl = (s.level.match(/L\d/) || ['L1'])[0];
    const arts = D.artifacts.filter(a => a.steps.length <= 3 && (a.steps.includes(s.n) || (s.n === '4' && a.steps.includes('G1b'))));
    const ag = s.n === 'R' ? ['gate-analyst'] : agentsIn(s.n);
    const lines = (s[profile] !== undefined) ? `<div class="row"><span>${esc(profile)} profile</span><div>${s[profile]}</div></div>` : '';
    return `<article class="step ${lvClass(lvl)}${sub === s.n ? ' hl' : ''}" id="step-${s.n}">
      <div class="sh"><span class="n">${s.n === 'R' ? '↺' : s.n}</span><h3>${s.name}</h3><span class="badge lv">${esc(s.level)}</span></div>
      ${s.what ? `<div class="row"><span>What it does</span><div>${s.what}</div></div>` : ''}${lines}
      ${ag.length ? `<div class="row"><span>Agents</span><div class="chips">${ag.map(id => `<a class="chip" href="#levels/${id}">my-agent:${id}</a>`).join('')}</div></div>` : ''}
      ${arts.length ? `<div class="row"><span>Deliverables</span><div class="chips">${arts.map(artChip).join('')}</div></div>` : ''}
      ${s.rules.map(r => src({ ...r, title: 'L1 procedure · ' + r.title }, false)).join('')}</article>`;
  };
  const gateBar = id => { const g = gateById[id]; return g ? `<div class="gatebar"><b>${id}</b><span>${g.gate.replace(/^<strong>|<\/strong>$/g, '')} — ${g.choices}</span><a href="#flow/gates" style="margin-left:auto;font-size:12px">details</a></div>` : ''; };
  return `<h1 class="page">Steps, gates and profiles</h1>
  <p class="lede">The 8 steps run in pairs as 4 phases, and each phase ends at a gate. Pick a profile to see what changes.</p>
  <div class="toolbar"><div class="seg" role="group" aria-label="Profile">${PROFILES.map(p => `<button type="button" data-prof="${p}" aria-pressed="${p === profile}">${p}</button>`).join('')}</div>
    <span class="muted" style="font-size:12.5px">${esc(P.title)} · <a href="#artifacts/run-log.md">run-log.md</a> gets lines in every step</span></div>
  <section class="panel"><h2>Overview <small>architecture 4.3</small></h2><pre class="code flowtext"><code>${esc(D.flow)}</code></pre><div class="md">${P.intro}</div></section>
  ${phases.map(p => `<section class="phase-block"><h2>${esc(p)}</h2>${D.steps.filter(s => s.phase === p).map(s => stepCard(s) + (gateAfter[s.n] ? gateBar(gateAfter[s.n]) : '')).join('')}${p === phases[phases.length - 1] ? stepCard(D.retro) : ''}</section>`).join('')}
  <section class="panel" id="step-gates" style="scroll-margin-top:110px"><h2>HITL gates <small>architecture 4.4</small></h2>
    <div class="tbl"><table><thead><tr><th>Gate</th><th>When</th><th>Enforcement</th><th>What the person sees</th><th>Choices</th></tr></thead><tbody>
    ${D.gates.map(g => `<tr><td>${g.gate}</td><td>${g.when}</td><td>${g.enforcement}</td><td>${g.sees}</td><td>${g.choices}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Rules per phase · ${esc(profile)} <small>${esc(P.file)}</small></h2>
    <div class="tbl"><table><thead><tr><th>Step</th><th>Rule</th></tr></thead><tbody>${P.rules.map(r => `<tr><td style="white-space:nowrap">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="panel"><h2>Skipping and combining</h2><div class="md">${D.skip}</div></section>`;
}

/* ---------- artifacts ---------- */
function viewArtifacts(id) {
  id = id ? decodeURIComponent(id) : 'plan.md';
  const a = D.artifacts.find(x => x.id === id) || D.artifacts[0];
  const top = D.artifacts.filter(x => x.id.startsWith('.'));
  const inTask = D.artifacts.filter(x => !x.id.startsWith('.'));
  const link = x => `<a href="#artifacts/${encodeURIComponent(x.id)}" aria-current="${x.id === a.id}">${esc(x.id)}<span class="tag">${x.steps.length > 3 ? 'all' : x.steps.join(' ')}</span></a>`;
  const opts = D.artifacts.map(x => `<option value="${encodeURIComponent(x.id)}"${x.id === a.id ? ' selected' : ''}>${esc(x.id)}</option>`).join('');
  const agents = D.agents.filter(g => a.writer.includes('my-agent:' + g.id));
  return `<div class="split"><aside class="side"><div class="list tree"><h3>&lt;task location&gt;/docs/agent/</h3>${top.map(link).join('')}
      <div class="root">&lt;task-id&gt;/</div>${inTask.map(link).join('')}</div>
      <select onchange="location.hash='artifacts/'+this.value" aria-label="File">${opts}</select></aside>
    <div><div class="panel"><div class="dhead"><h1>${esc(a.id)}</h1></div>
      ${a.comment ? `<p class="desc">${a.comment}</p>` : ''}
      <div class="kv"><div>Written by</div><div>${esc(a.writer)} ${agents.map(g => `<a class="chip" href="#levels/${g.id}">${g.call}</a>`).join(' ')}</div>
        <div>Steps</div><div class="chips">${a.steps.map(stepChip).join('')}</div>
        <div>Path</div><div><code>${esc(a.id.startsWith('.') ? `<task location>/docs/agent/${a.id}` : `<task location>/docs/agent/<task-id>/${a.id}`)}</code></div></div></div>
      <div class="panel"><h2>Format and rules <small>${a.sources.length} source${a.sources.length > 1 ? 's' : ''}</small></h2>${a.sources.map(s => src(s, true)).join('') || '<p class="muted">No format is written down for this file.</p>'}</div></div></div>`;
}

/* ---------- shared words ---------- */
function viewVocab() {
  return `<h1 class="page">Shared words and shapes</h1>
  <p class="lede">The words hooks, scripts and the monitor parse — verdict lines, status values, gate names, run-log line shape, plan.md markers. They live in one place, <code>l4-tools-guards/lib/ma_schema.py</code>, and <code>test_schema.py</code> checks that each agent definition still spells them.</p>
  ${D.vocab.map(g => `<section class="panel"><h2>${esc(g.title)}</h2><div class="tbl"><table><thead><tr><th>Name</th><th>Value</th><th>Note</th></tr></thead><tbody>
    ${g.items.map(i => `<tr><td class="mono" style="white-space:nowrap">${esc(i.name)}</td><td><code>${esc(i.value)}</code></td><td>${esc(i.note)}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}`;
}

/* ---------- router ---------- */
function route() {
  const [view, sub] = (location.hash.replace(/^#/, '') || 'overview').split('/');
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'].includes(view) ? view : 'overview';
  document.querySelectorAll('#tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.v === v ? 'page' : 'false'));
  $('main').innerHTML = { overview: viewOverview, levels: viewLevels, flow: viewFlow, artifacts: viewArtifacts, vocab: viewVocab }[v](sub);
  if (v === 'flow' && sub) { const el = $('step-' + sub); if (el) el.scrollIntoView({ block: 'start' }); }
  else window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-prof]');
  if (!b) return;
  profile = b.dataset.prof;
  try { localStorage.setItem('ma-profile', profile); } catch (err) {}
  const y = window.scrollY; route(); window.scrollTo(0, y);
});
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
try { theme = localStorage.getItem('ma-theme') || 'auto'; } catch (e) {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('theme').textContent = 'Theme: ' + theme;
}
$('theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem('ma-theme', theme); } catch (e) {}
  applyTheme();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = ['overview', 'levels', 'flow', 'artifacts', 'vocab'][+e.key - 1];
  if (v) location.hash = v;
});
$('ver').textContent = `plugin ${D.version} · design ${D.design}`;
applyTheme();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
